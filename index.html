      if(!skipChart && chartEl.offsetParent!==null) drawDetail(chartEl);
    }

    function table(){
      const base = zoom;
      document.getElementById(id+'-ttitle').textContent = base===root ? `Major groups of ${(cfg.rootLower||cfg.rootLabel.toLowerCase())}` : `Inside ${base.name}`;
      const rows = base.kids;
      const maxW = Math.max(...rows.map(k=>k.weight), 0.0001);
      document.getElementById(id+'-table').innerHTML = `<thead><tr><th>Category</th><th>Share of spending</th><th class="r">Prices vs. a year ago</th><th class="r">Adds to inflation</th></tr></thead><tbody>
        <tr class="click ${sel===base?'sel':''}" data-code="${base.code}"><td class="name"><b>${esc(base.name)}</b></td><td>${base.weight.toFixed(2)}%</td><td class="r">${yoyAt(base)!=null?spct(yoyAt(base)):'—'}</td><td class="r">${contribAt(base)!=null?pp(contribAt(base),2):'—'}</td></tr>
        ${rows.map(k=>`<tr class="click ${sel===k?'sel':''}" data-code="${k.code}"><td class="name">${esc(k.name)}${k.kids.length?'<span class="kid-mark">›</span>':''}</td>
          <td style="white-space:nowrap"><span class="wbar" style="width:${(k.weight/maxW*60).toFixed(1)}px"></span>${k.weight.toFixed(k.weight>=1?2:3)}%</td>
          <td class="r"><span class="chip ${yoyAt(k)>3?'up-bad':''}">${yoyAt(k)!=null?spct(yoyAt(k)):'—'}</span></td>
          <td class="r">${contribAt(k)!=null?pp(contribAt(k),2):'—'}</td></tr>`).join('')}</tbody>`;
      document.querySelectorAll(`#${id}-table tr.click`).forEach(tr=>tr.addEventListener('click', ()=>select(tr.dataset.code)));
    }

    // ---- every category, one sortable table ----
    const spark = n => {
      if(!n.has) return '';
      const a = Math.max(0, ti-35), pts = [];
      for(let i=a;i<=ti;i++){ const v=n.yoyS[i]; if(okv(v)) pts.push([i-a, v]); }
      if(pts.length<2) return '';
      const lo = Math.min(0, ...pts.map(p=>p[1])), hi = Math.max(0.5, ...pts.map(p=>p[1])), sx = 78/35, sy = 20/((hi-lo)||1);
      const d = pts.map((p,k)=>(k?'L':'M')+(1+p[0]*sx).toFixed(1)+' '+(21-(p[1]-lo)*sy).toFixed(1)).join('');
      const z = (21-(0-lo)*sy).toFixed(1);
      return `<svg class="mini" viewBox="0 0 80 22" width="80" height="22" aria-hidden="true"><line x1="0" x2="80" y1="${z}" y2="${z}"/><path d="${d}"/></svg>`;
    };
    const FCOLS = [
      {k:'name', l:'Category', v:n=>n.name},
      {k:'weight', l:'Share of spending', r:true, v:n=>n.weight},
      {k:'yoy', l:'Prices vs. a year ago', r:true, v:yoyAt},
      {k:'prev', l:'Same, a year earlier', r:true, v:prevAt, hide:true},
      {k:'accel', l:'Speeding up?', r:true, v:n=>{ const a=yoyAt(n), b=prevAt(n); return a!=null&&b!=null ? a-b : null; }},
      {k:'contrib', l:'Adds to inflation', r:true, v:contribAt},
    ];
    function flatRows(){
      const q = fQuery.trim().toLowerCase();
      let rows = all.filter(n=>n.has);
      if(fLevel==='groups') rows = rows.filter(n=>n.parent===cfg.rootCode);
      if(fLevel==='items') rows = rows.filter(n=>!n.kids.length);
      if(q) rows = rows.filter(n=>n.name.toLowerCase().includes(q) || (byCode.get(n.parent)||{name:''}).name.toLowerCase().includes(q));
      if(fHot) rows = rows.filter(n=>{ const y=yoyAt(n); return y!=null && y>(cfg.target||2); });
      const col = FCOLS.find(c=>c.k===fSort);
      rows.sort((a,b)=>{ const x=col.v(a), y=col.v(b);
        if(fSort==='name') return fDir*String(x).localeCompare(String(y));
        if(x==null && y==null) return 0; if(x==null) return 1; if(y==null) return -1; return fDir*(x-y); });
      return rows;
    }
    function flat(){
      const tb = document.getElementById(id+'-ftable'); if(!tb) return;
      const rows = flatRows(), LIMIT = 25, shown = fAll ? rows : rows.slice(0, LIMIT);
      const maxW = Math.max(...all.map(n=>n.weight), 0.0001);
      const fmt = {weight:n=>`<span class="wbar" style="width:${(Math.sqrt(n.weight/maxW)*46).toFixed(1)}px"></span>${n.weight.toFixed(n.weight>=1?2:3)}%`,
        yoy:n=>{ const v=yoyAt(n); return v==null?'—':`<span class="chip ${v>3?'up-bad':''}">${spct(v)}</span>`; },
        prev:n=>prevAt(n)==null?'—':spct(prevAt(n)),
        accel:n=>{ const v=FCOLS[4].v(n); return v==null?'—':`<span class="${v>0.05?'up-bad':v<-0.05?'down-good':'muted'}">${v>0.05?'▲ ':v<-0.05?'▼ ':''}${pp(v,1)}</span>`; },
        contrib:n=>contribAt(n)==null?'—':pp(contribAt(n),2)};
      tb.innerHTML = `<thead><tr>${FCOLS.map(c=>`<th class="${c.r?'r ':''}${c.hide?'hide-sm ':''}sortable" data-k="${c.k}" aria-sort="${fSort===c.k?(fDir>0?'ascending':'descending'):'none'}"><button type="button">${c.l}<span class="sort-ic">${fSort===c.k?(fDir>0?'↑':'↓'):'↕'}</span></button></th>`).join('')}<th class="hide-sm">Last 3 years</th></tr></thead>
        <tbody>${shown.length ? shown.map(n=>{ const par = n.parent && n.parent!==cfg.rootCode && byCode.get(n.parent);
          return `<tr class="click${sel===n?' sel':''}" data-code="${n.code}" tabindex="0"><td class="name"><span class="lvl lvl-${Math.min(depthOf(n),4)}"></span>${esc(n.name)}${n.kids.length?`<span class="kid-mark">${n.kids.length} sub</span>`:''}${par?`<div class="muted" style="font-size:11.5px">${esc(par.name)}</div>`:''}</td>
            ${FCOLS.slice(1).map(c=>`<td class="r${c.hide?' hide-sm':''}" style="white-space:nowrap">${fmt[c.k](n)}</td>`).join('')}<td class="hide-sm">${spark(n)}</td></tr>`; }).join('')
          : `<tr><td colspan="${FCOLS.length+1}"><div class="empty">No categories match. Try a different filter.</div></td></tr>`}</tbody>`;
      document.getElementById(id+'-fsub').innerHTML = `${rows.length} of ${all.filter(n=>n.has).length} categories · as of ${fmtMonth(T.dates[ti])} · click a column to sort, a row to chart it. “Speeding up?” ▲ means prices are rising faster than a year earlier. “Points” means percentage points.`;
      const more = document.getElementById(id+'-more');
      more.hidden = rows.length <= LIMIT; more.textContent = fAll ? 'Show fewer' : `Show all ${rows.length}`;
      tb.querySelectorAll('th.sortable button').forEach(b=>b.addEventListener('click', ()=>{ const k=b.parentElement.dataset.k; if(fSort===k) fDir=-fDir; else { fSort=k; fDir = k==='name'?1:-1; } flat(); }));
      tb.querySelectorAll('tr.click').forEach(tr=>{ const go=()=>{ select(tr.dataset.code); document.getElementById(id+'-detail').scrollIntoView({behavior:'smooth', block:'center'}); };
        tr.addEventListener('click', go); tr.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } }); });
    }
    function csv(){
      const rows = flatRows(), q = v => `"${String(v).replace(/"/g,'""')}"`, f = (v,d) => v==null ? '' : v.toFixed(d);
      const lines = [['Category','Parent','Weight %','12-month %','Year earlier %','Change in pace (points)','Contribution (points)'].join(',')]
        .concat(rows.map(n=>[q(n.name), q((byCode.get(n.parent)||{name:''}).name), f(n.weight,3), f(yoyAt(n),2), f(prevAt(n),2), f(FCOLS[4].v(n),2), f(contribAt(n),3)].join(',')));
      const url = URL.createObjectURL(new Blob([lines.join('\n')], {type:'text/csv'}));
      const a = document.createElement('a'); a.href = url; a.download = `${(cfg.rootLower||cfg.rootLabel).replace(/\W+/g,'-').toLowerCase()}-categories-${T.dates[ti].toISOString().slice(0,7)}.csv`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 1000);
    }

    // ---- time travel ----
    const tIn = document.getElementById(id+'-t'), whenEl = document.getElementById(id+'-when'), liveBtn = document.getElementById(id+'-live'), playBtn = document.getElementById(id+'-play');
    let timer = null;
    function setTime(v, quiet){
      ti = Math.max(minTi, Math.min(rootLi, v)); tIn.value = ti;
      whenEl.textContent = fmtMonth(T.dates[ti]) + (ti===rootLi ? ' · latest' : '');
      tIn.style.setProperty('--p', ((ti-minTi)/((rootLi-minTi)||1)*100).toFixed(1)+'%');
      liveBtn.hidden = ti===rootLi;
      if(quiet) return;
      if(tmEl.offsetParent!==null) drawTM(tmEl); table(); detailKpis(); flat();
    }
    function stop(){ if(timer){ clearInterval(timer); timer=null; } playBtn.classList.remove('on'); playBtn.setAttribute('aria-label','Play the last five years'); }
    playBtn.addEventListener('click', ()=>{
      if(timer){ stop(); return; }
      if(ti>=rootLi) setTime(rootLi-60);
      playBtn.classList.add('on'); playBtn.setAttribute('aria-label','Pause');
      timer = setInterval(()=>{ if(ti>=rootLi) stop(); else setTime(ti+1); }, 140);
    });
    tIn.addEventListener('input', ()=>{ stop(); setTime(+tIn.value); });
    liveBtn.addEventListener('click', ()=>{ stop(); setTime(rootLi); });
    const qIn = document.getElementById(id+'-q');
    const tryPick = () => { const v = qIn.value.trim().toLowerCase(); if(!v) return false;
      let code = nameToCode.get(v);
      if(!code){ const hit = all.find(n=>n.name.toLowerCase()===v) || all.find(n=>n.name.toLowerCase().startsWith(v)) || all.find(n=>n.name.toLowerCase().includes(v)); code = hit && hit.code; }
      if(code){ select(code); qIn.value=''; qIn.blur(); return true; } return false; };
    qIn.addEventListener('change', tryPick);
    qIn.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); if(!tryPick()) qIn.classList.add('miss'); } else qIn.classList.remove('miss'); });
    document.getElementById(id+'-fq').addEventListener('input', e=>{ fQuery = e.target.value; flat(); });
    document.getElementById(id+'-hot').addEventListener('change', e=>{ fHot = e.target.checked; flat(); });
    document.getElementById(id+'-more').addEventListener('click', ()=>{ fAll = !fAll; flat(); });
    document.getElementById(id+'-csv').addEventListener('click', csv);
    bindSeg(id+'-lvl', v=>{ fLevel = v; flat(); });

    const detailKpis = () => detail(true);
    function render(){ crumbs(); if(tmEl.offsetParent!==null) drawTM(tmEl); detail(); table(); flat(); }

    tmEl.__draw = drawTM; charts.push(tmEl);
    chartEl.__draw = drawDetail; charts.push(chartEl);
    bindSeg(id+'-view', v=>{ view=v; detail(); });
    bindSeg(id+'-range', v=>{ months=+v; if(chartEl.offsetParent!==null) drawDetail(chartEl); });
    setTime(rootLi, true);

    if(cfg.movers){
      const leaves = [...byCode.values()].filter(n=>!n.kids.length && n.has && n.yoy!=null && n.weight>=0.03 && n.date.getTime()===root.date.getTime());
      const up = leaves.slice().sort((a,b)=>b.yoy-a.yoy).slice(0,8), down = leaves.slice().sort((a,b)=>a.yoy-b.yoy).slice(0,8);
      const list = (arr, title) => `<div class="card"><p class="card-title">${title}</p><p class="card-sub">12-month change, ${fmtMonth(root.date)} · tiny items left out.</p>
        <table class="xtable"><tbody>${arr.map(n=>`<tr class="click" data-code="${n.code}"><td class="name">${esc(n.name)}<div class="muted" style="font-size:12px">${esc(byCode.get(n.parent)?byCode.get(n.parent).name:'')} · ${n.weight.toFixed(2)}% of spending</div></td><td class="r"><span class="chip">${spct(n.yoy)}</span></td></tr>`).join('')}</tbody></table></div>`;
      cfg.movers.innerHTML = leaves.length ? `<div class="movers">${list(up,'Fastest-rising prices')}${list(down,'Falling or barely rising')}</div>` : '';
      cfg.movers.querySelectorAll('tr.click').forEach(tr=>tr.addEventListener('click', ()=>{ select(tr.dataset.code); cfg.el.scrollIntoView({behavior:'smooth', block:'start'}); }));
    }
    if(cfg.initial && byCode.has(cfg.initial)) select(cfg.initial); else render();
    return {select, byCode, root, el:cfg.el, detailEl:document.getElementById(id+'-detail')};
  }

  // "what's driving it": each major group's contribution (weight x 12-month change), now and over time
  function contribSection(cfg){
    const ex = cfg.ex, el = cfg.el;
    if(!ex || !ex.root || !ex.root.has){ el.innerHTML = ''; return; }
    const root = ex.root, T = cfg.table, id = cfg.id, li = root.li, head = root.yoyS[li];
    const okv = v => v!=null && isFinite(v);
    const COLORS = ['--c-actual','--c-model','--c-3','--c-5','--c-6','--c-7','--c-4','--c-8'];
    const majors = root.kids.filter(k=>k.has && k.weight>0 && okv(k.yoyS[li]));
    // colour the groups that actually move the total (average size of contribution over 5 years); the rest share one grey
    const avgAbs = g => { let t=0, c=0; for(let i=Math.max(0,li-59); i<=li; i++){ if(okv(g.yoyS[i])){ t+=Math.abs(g.weight*g.yoyS[i]/100); c++; } } return c?t/c:0; };
    const byW = majors.slice().sort((a,b)=>avgAbs(b)-avgAbs(a)), maxG = cfg.maxGroups || 8;
    const shown = byW.length>maxG ? byW.slice(0,maxG-1) : byW, rest = byW.length>maxG ? byW.slice(maxG-1) : [];
    const colorOf = new Map(shown.map((g,k)=>[g.code, COLORS[k%COLORS.length]]));
    const METRICS = {
      contrib:{label:'Adds to inflation', v:g=>g.weight*g.yoyS[li]/100, fmt:v=>(v>=0?'+':'−')+Math.abs(v).toFixed(2), unit:'points added to the total'},
      yoy:{label:'Price change', v:g=>g.yoyS[li], fmt:v=>spct(v), unit:'how fast each group’s own prices rose'},
      weight:{label:'Share of spending', v:g=>g.weight, fmt:v=>v.toFixed(1)+'%', unit:'share of what people spend'},
    };
    let metric = 'contrib', hover = null, range = 60;
    const top = majors.slice().sort((a,b)=>METRICS.contrib.v(b)-METRICS.contrib.v(a))[0];
    const topShare = METRICS.contrib.v(top)/head*100;
    el.innerHTML = `
      <div class="card">
        <div class="card-head"><div><p class="card-title" id="${id}-btitle"></p><p class="card-sub" id="${id}-bsub"></p></div>
          ${segControl(id+'-m', Object.entries(METRICS).map(([v,m])=>({v, label:m.label})), 'contrib')}</div>
        <div class="cbars" id="${id}-bars"></div>
        <p class="cnote">${okv(topShare)&&topShare>0&&topShare<=100?`<b>${esc(top.name)}</b> alone adds ${pp(METRICS.contrib.v(top),2)}, about ${topShare.toFixed(0)}% of the ${pct(head)} total. `:''}Click any group to open it in the explorer below.</p>
      </div>
      <div class="card" style="margin-top:12px">
        <div class="card-head"><div><p class="card-title">Contributions over time</p>
          <p class="card-sub">Each bar shows which groups made up that month’s inflation, like slices of a stacked cake. The line is the total. Hover a color in the legend to spotlight it. (Rough split, using ${esc(cfg.weightNote)} spending shares.)</p></div>
          ${segControl(id+'-r', [{v:'60',label:'5Y'},{v:'120',label:'10Y'},{v:'240',label:'20Y'}], '60')}</div>
        <div class="legend clegend" id="${id}-legend">${shown.map(g=>`<button type="button" data-code="${g.code}"><i class="key-area" style="background:var(${colorOf.get(g.code)})"></i>${esc(g.name)}</button>`).join('')}${rest.length?`<button type="button" data-code="_rest"><i class="key-area" style="background:var(--c-ref)"></i>${rest.length} other groups</button>`:''}<span><i class="key-line" style="background:var(--ink)"></i>${esc(cfg.rootLabel)}</span></div>
        <div class="chart" id="${id}-chart"></div>
      </div>`;
    function bars(){
      const M = METRICS[metric], rows = majors.map(g=>({g, v:M.v(g)})).sort((a,b)=>b.v-a.v);
      const lo = Math.min(0, ...rows.map(r=>r.v)), hi = Math.max(0, ...rows.map(r=>r.v)), span = (hi-lo)||1, zero = (0-lo)/span*100;
      document.getElementById(id+'-btitle').textContent = metric==='contrib' ? `How much each group adds to the ${pct(head)} ${cfg.rootLower} inflation rate` : metric==='yoy' ? `How fast prices are rising in each group` : `How big each group is in the ${cfg.rootLower} basket`;
      document.getElementById(id+'-bsub').textContent = `${fmtMonthLong(T.dates[li])} · ${M.unit}.` + (metric==='contrib' ? ' Points = share of spending × how much its prices rose.' : '');
      const headRow = metric==='contrib' ? `<div class="cb-row cb-head" aria-hidden="true"><span></span><span></span><span class="cb-v">Points<span class="cshare">of total</span></span></div>` : '';
      document.getElementById(id+'-bars').innerHTML = headRow + rows.map(r=>{
        const w = Math.abs(r.v)/span*100, left = r.v>=0 ? zero : zero-w, c = metric==='contrib' ? `var(${colorOf.get(r.g.code)||'--c-ref'})` : metric==='yoy' ? `var(--h${heatBin(r.v)})` : 'var(--c-actual)';
        const share = metric==='contrib' && head>0 ? `<span class="cshare">${Math.abs(r.v/head*100)<0.5?'0':(r.v/head*100).toFixed(0)}%</span>` : '';
        return `<button type="button" class="cb-row" data-code="${r.g.code}" aria-label="${esc(r.g.name)}: ${M.label} ${M.fmt(r.v)}"><span class="cb-name">${esc(r.g.name)}</span>
          <span class="cb-track"><span class="hb-zero" style="left:${zero}%"></span><span class="cb-bar" style="left:${left}%;width:${Math.max(w,.4)}%;background:${c}"></span></span>
          <span class="cb-v num">${M.fmt(r.v)}${share}</span></button>`;
      }).join('');
      el.querySelectorAll('button.cb-row').forEach(b=>b.addEventListener('click', ()=>cfg.onPick(b.dataset.code)));
    }
    function chart(){
      const idx = []; for(let i=Math.max(0, li-range+1); i<=li; i++) idx.push(i);
      const stack = g => idx.map(i=>okv(g.yoyS[i]) ? g.weight*g.yoyS[i]/100 : null);
      const stacks = shown.map(g=>({label:g.name, color:colorOf.get(g.code), code:g.code, values:stack(g)}));
      if(rest.length) stacks.push({label:'Other groups', color:'--c-ref', code:'_rest', values:idx.map(i=>{ let s=0, any=false; rest.forEach(g=>{ if(okv(g.yoyS[i])){ s+=g.weight*g.yoyS[i]/100; any=true; } }); return any?s:null; })});
      const chEl = document.getElementById(id+'-chart');
      mount(chEl, stackedColumns({aria:'Contributions to '+cfg.rootLower+' inflation by group', height:H(320,260), dates:idx.map(i=>T.dates[i]),
        stacks, line:{label:cfg.rootLabel, values:idx.map(i=>root.yoyS[i])}, yFmt:(v,d)=>v.toFixed(d)+'%', tipFmt:v=>v.toFixed(2)+(Math.abs(v)<20?' points':'')}));
      highlight();
    }
    function highlight(){
      const chEl = document.getElementById(id+'-chart'), k = hover ? [...shown.map(g=>g.code), '_rest'].indexOf(hover) : -1;
      chEl.classList.toggle('dim', k>=0);
      chEl.querySelectorAll('[data-stack]').forEach(r=>r.classList.toggle('hi', +r.dataset.stack===k));
      el.querySelectorAll('.clegend button').forEach(b=>b.classList.toggle('hi', b.dataset.code===hover));
    }
    el.querySelectorAll('.clegend button').forEach(b=>{
      b.addEventListener('pointerenter', ()=>{ hover=b.dataset.code; highlight(); });
      b.addEventListener('pointerleave', ()=>{ hover=null; highlight(); });
      b.addEventListener('click', ()=>{ if(b.dataset.code!=='_rest') cfg.onPick(b.dataset.code); });
    });
    bindSeg(id+'-m', v=>{ metric=v; bars(); });
    bindSeg(id+'-r', v=>{ range=+v; chart(); });
    bars(); chart();
  }

  // static mini treemap of the top level (overview page)
  function miniTreemap(el, nodes, onPick){
    const W = el.clientWidth || 600, H = W<520 ? 300 : 240;
    el.style.height = H+'px';
    const items = nodes.filter(n=>n.weight>0).map(n=>({node:n, v:n.weight})).sort((a,b)=>b.v-a.v);
    const tot = items.reduce((s,i)=>s+i.v,0) || 1, sc = W*H/tot;
    const rects = squarify(items.map(i=>({...i, v:i.v*sc})), {x:0,y:0,w:W,h:H});
    el.innerHTML = rects.map(r=>{ const n=r.node, b=heatBin(n.yoy);
      return `<button class="tm-tile" data-code="${n.code}" style="left:${r.x+1}px;top:${r.y+1}px;width:${Math.max(0,r.w-2)}px;height:${Math.max(0,r.h-2)}px;${b==null?'background:var(--grid)':`background:var(--h${b});color:var(--hi${b})`}">
        ${r.w>=60&&r.h>=34?`<span class="tm-name">${esc(n.name)}</span>`:''}${r.w>=44&&r.h>=22?`<span class="tm-meta">${r.w>=60&&r.h>=34?n.weight.toFixed(1)+'% · ':''}${n.yoy!=null?spct(n.yoy):''}</span>`:''}</button>`; }).join('');
    el.querySelectorAll('.tm-tile').forEach(t=>t.addEventListener('click', ()=>onPick(t.dataset.code)));
  }

  // stacked columns (contributions), with an optional total line on the same axis
  function stackedColumns(cfg){
    return function draw(el){
      const W = Math.max(200, el.clientWidth || 600), Ht = typeof cfg.height==='function' ? cfg.height(W) : (cfg.height||300);
      const m = {t:12, r:12, b:28, l:46}, pw=W-m.l-m.r, ph=Ht-m.t-m.b, N=cfg.dates.length;
      const pos=new Array(N).fill(0), neg=new Array(N).fill(0);
      cfg.stacks.forEach(s=>s.values.forEach((v,i)=>{ if(v==null) return; if(v>=0) pos[i]+=v; else neg[i]+=v; }));
      const vals = pos.concat(neg, (cfg.line?cfg.line.values:[]).filter(v=>v!=null), [0]);
      const yt = niceTicks(Math.min(...vals), Math.max(...vals), 5), y0=yt[0], y1=yt[yt.length-1], dec=tickDecimals(yt);
      const Y = v => m.t + ph - (v-y0)/(y1-y0)*ph;
      const band = pw/N, bw = Math.max(1.5, Math.min(18, band*0.72));
      let s = `<svg viewBox="0 0 ${W} ${Ht}" height="${Ht}" role="img" aria-label="${esc(cfg.aria||'Chart')}"><g class="grid">` + yt.map(t=>`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/>`).join('') + `</g>`;
      s += yt.map(t=>`<text x="${m.l-8}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end">${cfg.yFmt(t,dec)}</text>`).join('');
      const mt = monthTicks(cfg.dates[0], cfg.dates[N-1], pw);
      mt.ticks.forEach(d=>{ const i=cfg.dates.findIndex(x=>x.getTime()===d.getTime()); if(i>=0) s+=`<text x="${(m.l+band*i+band/2).toFixed(1)}" y="${Ht-8}" text-anchor="middle">${mt.fmt(d)}</text>`; });
      for(let i=0;i<N;i++){
        let up=0, dn=0; const x = m.l+band*i+band/2-bw/2;
        cfg.stacks.forEach((st,si)=>{
          const v=st.values[i]; if(v==null || v===0) return;
          const a = v>=0 ? up : dn, b = a+v; if(v>=0) up=b; else dn=b;
          const yA=Y(a), yB=Y(b);
          s += `<rect data-stack="${si}" x="${x.toFixed(1)}" y="${Math.min(yA,yB).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0.5,Math.abs(yA-yB)).toFixed(1)}" style="fill:var(${st.color})" stroke="var(--surface)" stroke-width="${bw>5?1:0}"/>`;
        });
      }
      s += `<line class="baseline" x1="${m.l}" x2="${W-m.r}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}"/>`;
      if(cfg.line){
        let d='', on=false; cfg.line.values.forEach((v,i)=>{ if(v==null){ on=false; return; } d+=(on?' L':' M')+(m.l+band*i+band/2).toFixed(1)+' '+Y(v).toFixed(1); on=true; });
        s += `<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>`;
      }
      s += `<line class="xhair" x1="0" x2="0" y1="${m.t}" y2="${m.t+ph}" visibility="hidden"/><rect class="hit" x="${m.l}" y="0" width="${pw}" height="${Ht}" fill="transparent"/></svg>`;
      el.innerHTML = s;
      const tip=document.createElement('div'); tip.className='tip'; el.appendChild(tip);
      const svg=el.querySelector('svg'), hit=svg.querySelector('.hit'), xh=svg.querySelector('.xhair');
      function show(e){
        const r=svg.getBoundingClientRect(), px=(e.clientX-r.left)*(W/r.width);
        const i=Math.max(0, Math.min(N-1, Math.floor((px-m.l)/band)));
        tip.textContent='';
        const dt=document.createElement('div'); dt.className='t-date'; dt.textContent=fmtMonthLong(cfg.dates[i]); tip.appendChild(dt);
        const row=(k,color,v,line)=>{ const d=document.createElement('div'); d.className='t-row'; const a=document.createElement('span'); a.className='t-key'; if(color){ const sw=document.createElement('span'); sw.className=line?'key-line':'key-area'; sw.style.background=color; a.appendChild(sw); } a.appendChild(document.createTextNode(k)); const b=document.createElement('b'); b.textContent=v; d.appendChild(a); d.appendChild(b); tip.appendChild(d); };
        if(cfg.line && cfg.line.values[i]!=null) row(cfg.line.label, 'var(--ink)', cfg.tipFmt(cfg.line.values[i]), true);
        cfg.stacks.slice().reverse().forEach(st=>{ if(st.values[i]!=null) row(st.label, `var(${st.color})`, cfg.tipFmt(st.values[i])); });
        const x=m.l+band*i+band/2; xh.setAttribute('x1',x); xh.setAttribute('x2',x); xh.setAttribute('visibility','visible');
        tip.style.opacity=1; const sc=r.width/W; let left=x*sc+14; if(left+tip.offsetWidth>r.width) left=x*sc-tip.offsetWidth-14;
        tip.style.left=Math.max(0,left)+'px'; tip.style.top=(m.t*sc)+'px';
      }
      hit.addEventListener('pointermove', show); hit.addEventListener('pointerdown', show);
      hit.addEventListener('pointerleave', ()=>{ tip.style.opacity=0; xh.setAttribute('visibility','hidden'); });
    };
  }

  // yield curve: categorical maturities on x, one line per date
  function curveChart(cfg){
    return function draw(el){
      const W=Math.max(200, el.clientWidth||600), Ht=cfg.height||280, m={t:16, r:20, b:30, l:46}, pw=W-m.l-m.r, ph=Ht-m.t-m.b;
      const K=cfg.labels.length, X=k=>m.l + (K>1 ? k/(K-1)*pw : pw/2);
      const vals=[]; cfg.series.forEach(s=>s.values.forEach(v=>{ if(v!=null) vals.push(v); })); vals.push(0);
      const yt=niceTicks(Math.min(...vals), Math.max(...vals), 5), y0=yt[0], y1=yt[yt.length-1], dec=tickDecimals(yt);
      const Y=v=>m.t+ph-(v-y0)/(y1-y0)*ph;
      let s=`<svg viewBox="0 0 ${W} ${Ht}" height="${Ht}" role="img" aria-label="${esc(cfg.aria||'Yield curve')}"><g class="grid">`+yt.map(t=>`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/>`).join('')+`</g>`;
      s+=yt.map(t=>`<text x="${m.l-8}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end">${t.toFixed(dec)}%</text>`).join('');
      s+=cfg.labels.map((l,k)=>`<text x="${X(k).toFixed(1)}" y="${Ht-8}" text-anchor="middle">${esc(l)}</text>`).join('');
      cfg.series.forEach(se=>{
        const pts=se.values.map((v,k)=>v==null?null:[X(k),Y(v)]).filter(Boolean);
        s+=`<path class="s s-${se.cls}${se.dashed?' dashed':''}" d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}"/>`;
        s+=pts.map(p=>`<circle class="dot-${se.cls} ring" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4"/>`).join('');
      });
      s+=`<line class="xhair" x1="0" x2="0" y1="${m.t}" y2="${m.t+ph}" visibility="hidden"/><rect class="hit" x="0" y="0" width="${W}" height="${Ht}" fill="transparent"/></svg>`;
      el.innerHTML=s;
      const tip=document.createElement('div'); tip.className='tip'; el.appendChild(tip);
      const svg=el.querySelector('svg'), hit=svg.querySelector('.hit'), xh=svg.querySelector('.xhair');
      hit.addEventListener('pointermove', e=>{
        const r=svg.getBoundingClientRect(), px=(e.clientX-r.left)*(W/r.width);
        let k=0, bd=Infinity; for(let j=0;j<K;j++){ const d=Math.abs(X(j)-px); if(d<bd){ bd=d; k=j; } }
        tip.textContent=''; const dt=document.createElement('div'); dt.className='t-date'; dt.textContent=cfg.labels[k]; tip.appendChild(dt);
        let any=false;
        cfg.series.forEach(se=>{ const v=se.values[k]; if(v==null) return; any=true;
          const d=document.createElement('div'); d.className='t-row'; const a=document.createElement('span'); a.className='t-key'; const sw=document.createElement('span'); sw.className='key-line'; sw.style.background=`var(${COLOR_VAR[se.cls]})`; a.appendChild(sw); a.appendChild(document.createTextNode(se.label)); const b=document.createElement('b'); b.textContent=v.toFixed(2)+'%'; d.appendChild(a); d.appendChild(b); tip.appendChild(d); });
        if(!any){ tip.style.opacity=0; return; }
        xh.setAttribute('x1',X(k)); xh.setAttribute('x2',X(k)); xh.setAttribute('visibility','visible');
        tip.style.opacity=1; const sc=r.width/W; let left=X(k)*sc+14; if(left+tip.offsetWidth>r.width) left=X(k)*sc-tip.offsetWidth-14;
        tip.style.left=Math.max(0,left)+'px'; tip.style.top=(m.t*sc)+'px';
      });
      hit.addEventListener('pointerleave', ()=>{ tip.style.opacity=0; xh.setAttribute('visibility','hidden'); });
    };
  }

  // accuracy-by-horizon rows (shared by CPI, PCE and rates)
  function horizonTable(hz, opts){
    const pick = hz.filter(r=>[1,3,6,12].includes(r.h));
    if(!pick.length) return '';
    const maxV = Math.max(...pick.map(r=>Math.max(r.m, r.nv)));
    return `<div class="legend"><span><i class="key-area" style="background:var(--c-model)"></i>${esc(opts.model)}</span><span><i class="key-area" style="background:var(--c-ref)"></i>${esc(opts.naive||'Just repeating today’s rate')}</span></div>
      <div class="hz-row hz-head"><span>Months ahead</span><span>Average miss (${opts.unit==='pp'||!opts.unit?'points':opts.unit})</span><span class="hz-cov">Inside likely range</span></div>
      ${pick.map(r=>`<div class="hz-row"><span>${r.h} month${r.h>1?'s':''}</span><span class="hz-bars">
        <span class="hz-bar"><span class="b model" style="width:${(r.m/maxV*85).toFixed(1)}%"></span><span class="v">${r.m.toFixed(2)}</span></span>
        <span class="hz-bar"><span class="b naive" style="width:${(r.nv/maxV*85).toFixed(1)}%"></span><span class="v">${r.nv.toFixed(2)}</span></span></span>
        <span class="hz-cov">${r.cov.toFixed(0)}% <span class="muted" style="font-size:12px">of ${r.n}</span></span></div>`).join('')}`;
  }
  const hzParse = rows => rows.map(r=>({series:r.series, h:+r.horizon, n:+r.n, m:num(r.model_mae), nv:num(r.naive_mae), cov:num(r.coverage_95)})).filter(r=>r.m!=null).sort((a,b)=>a.h-b.h);

  // ================= app =================
  const SITE = "U.S. Economic Forecast";
  async function main(){
    const app = document.getElementById('app');
    let cpiRaw, fcRaw, btRaw, errRaw, xRaw, arRaw, hzRaw, schRaw, bmRaw, bmErrRaw,
        compRaw, wRaw, apRaw, pceRaw, pceFcRaw, pceHzRaw, pceWRaw, pceCompRaw, rFcRaw, rBtRaw;
    try{
      [cpiRaw, fcRaw, btRaw, errRaw, xRaw, arRaw, hzRaw, schRaw, bmRaw, bmErrRaw,
       compRaw, wRaw, apRaw, pceRaw, pceFcRaw, pceHzRaw, pceWRaw, pceCompRaw, rFcRaw, rBtRaw] = await Promise.all([
        loadCSV('data/cpi_data.csv'),
        loadCSV('data/yoy_forecast.csv'),
        loadCSV('data/rolling_backtest.csv'),
        loadCSV('data/backtest_errors.csv', true),
        loadCSV('data/extra_series.csv', true),
        loadCSV('data/forecast_archive.csv', true),
        loadCSV('data/horizon_backtest.csv', true),
        loadCSV('data/cpi_release_schedule.csv', true),
        loadCSV('data/model_benchmark.csv', true),
        loadCSV('data/model_benchmark_errors.csv', true),
        loadCSV('data/cpi_components.csv', true),
        loadCSV('data/cpi_weights.csv', true),
        loadCSV('data/avg_prices.csv', true),
        loadCSV('data/pce_data.csv', true),
        loadCSV('data/pce_forecast.csv', true),
        loadCSV('data/pce_horizon_backtest.csv', true),
        loadCSV('data/pce_weights.csv', true),
        loadCSV('data/pce_components.csv', true),
        loadCSV('data/rates_forecast.csv', true),
        loadCSV('data/rates_backtest.csv', true),
      ]);
    }catch(err){
      app.innerHTML = `<div class="error">Could not load data files — ${esc(err.message)}.<br>This page must be served over HTTP (e.g. GitHub Pages or <code>python -m http.server</code>).</div>`;
      return;
    }

    // ---------- headline CPI: complete monthly series ----------
    const raw = cpiRaw.map(r=>({date:parseDate(r.date), cpi:num(r.cpi)})).filter(r=>r.cpi!=null).sort((a,b)=>a.date-b.date);
    const data=[];
    for(let i=0;i<raw.length;i++){
      if(i>0){ const p=raw[i-1], c=raw[i], g=monthDiff(p.date,c.date); for(let k=1;k<g;k++) data.push({date:addMonths(p.date,k), cpi:p.cpi+(c.cpi-p.cpi)*k/g, interpolated:true}); }
      data.push(raw[i]);
    }
    data.forEach((d,i)=>{ d.mom = i>0 ? (d.cpi/data[i-1].cpi-1)*100 : null; d.yoy = i>=12 ? (d.cpi/data[i-12].cpi-1)*100 : null; });
    const yoyData = data.filter(d=>d.yoy!=null);
    const latest = data[data.length-1], prev = data[data.length-2];
    const cpiAt = new Map(data.map(d=>[d.date.getTime(), d]));
    const now = new Date(), todayUTC = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    const nextRelease = schRaw.map(r=>({ref:parseDate(r.reference_month), date:parseDate(r.release_date)}))
      .filter(r=>r.ref>latest.date && r.date.getTime()>=todayUTC).sort((a,b)=>a.date-b.date)[0];
    const fmtDay = d => MONTHS[d.getUTCMonth()] + ' ' + d.getUTCDate();
    const nextText = nextRelease ? (nextRelease.date.getTime()===todayUTC ? 'today, 8:30 a.m. ET' : fmtDay(nextRelease.date)) : null;

    // ---------- CPI forecast & backtest ----------
    const forecast = fcRaw.map(r=>({date:parseDate(r.date), mean:num(r.mean), lo:num(r.mean_ci_lower), hi:num(r.mean_ci_upper)})).filter(r=>r.mean!=null).sort((a,b)=>a.date-b.date);
    const next = forecast[0], last12 = forecast[forecast.length-1];
    const bt = btRaw.map(r=>({model:cleanModel(r.model), mae:num(r.mae), rmse:num(r.rmse)})).filter(r=>r.mae!=null);
    const naive = bt.find(r=>/naive/i.test(r.model));
    const model = bt.find(r=>r.model===MODEL_NAME) || bt.filter(r=>!/naive/i.test(r.model)).sort((a,b)=>a.rmse-b.rmse)[0];
    const modelLabel = (model ? model.model : MODEL_NAME).replace(/\s/g,'');
    const maeGain = (model && naive) ? (1 - model.mae/naive.mae)*100 : null;
    // 12-months-ahead accuracy vs a no-change guess; used on the overview so every mention shows the same number
    const hzEdge = (()=>{ const h = (hzRaw||[]).map(r=>({h:+r.horizon, m:num(r.model_mae), nv:num(r.naive_mae)})).filter(r=>r.m!=null&&r.nv!=null&&r.nv>0).sort((a,b)=>a.h-b.h); const l = h[h.length-1]; return l ? (1-l.m/l.nv)*100 : null; })();
    const errs = errRaw.map(r=>({date:parseDate(r.date), model:cleanModel(r.model), actual:num(r.actual), forecast:num(r.forecast), error:num(r.error), abs:num(r.abs_error)}));
    const errModel = model ? errs.filter(e=>e.model===model.model).sort((a,b)=>a.date-b.date) : [];
    const errNaive = errs.filter(e=>/naive/i.test(e.model)).sort((a,b)=>a.date-b.date);
    const hasErrors = errModel.length>0 && errNaive.length===errModel.length;

    // ---------- supporting FRED series (monthly) ----------
    const X = wideTable(xRaw, ['gs30']);
    function seriesFrom(col, start){
      if(!X || !X.has(col)) return null;
      const v = X.cols[col]; const out=[];
      for(let i=0;i<X.dates.length;i++){ if(v[i]!=null && (!start || X.dates[i]>=start)) out.push({date:X.dates[i], v:v[i], i}); }
      return out;
    }
    function compYoY(col){
      if(!X || !X.has(col)) return null;
      const y = yoyOf(X.cols[col]);
      return X.dates.map((d,i)=>({date:d, v:y[i]})).filter(p=>p.v!=null);
    }

    // ---------- CPI categories (BLS) ----------
    const COMP = wideTable(compRaw);
    const cpiNodes = wRaw.map(r=>({code:r.code, name:(r.name==='Care of invalids and elderly at home'?'Home care for elderly and disabled':r.name), parent:r.parent||null, weight:num(r.weight)})).filter(n=>n.weight!=null);
    const cpiMajor = cpiNodes.filter(n=>n.parent==='SA0').map(n=>{
      const v = COMP && COMP.cols[n.code]; if(!v || lastIdx(v)<0) return {...n, yoy:null};
      const y = yoyOf(v), li = lastIdx(v); return {...n, yoy:y[li], yoyS:y, date:COMP.dates[li]};
    });
    const hasCats = !!COMP && cpiNodes.length>0 && cpiMajor.some(n=>n.yoy!=null);

    // ---------- PCE ----------
    const PT = wideTable(pceRaw);
    const pceSeries = (()=>{
      if(!PT || !PT.has('pce')) return [];
      const y = yoyOf(PT.cols.pce), yc = PT.cols.core_pce ? yoyOf(PT.cols.core_pce) : [];
      return PT.dates.map((d,i)=>({date:d, v:y[i], core:yc[i]!=null?yc[i]:null, level:PT.cols.pce[i]})).filter(p=>p.v!=null);
    })();
    const pceLast = pceSeries[pceSeries.length-1];
    const pceAt = new Map(pceSeries.map(p=>[p.date.getTime(), p]));
    const pceFc = s => pceFcRaw.filter(r=>r.series===s).map(r=>({date:parseDate(r.date), mean:num(r.mean), lo:num(r.lower), hi:num(r.upper), model:r.model})).filter(r=>r.mean!=null).sort((a,b)=>a.date-b.date);
    const pceF = {pce:pceFc('pce'), core_pce:pceFc('core_pce')};
    const pceHz = hzParse(pceHzRaw);
    // BEA names that read like jargon get a plain-English label on screen
    const PCE_LABELS = {'Personal consumption expenditures':'All PCE spending', 'Owner-occupied housing (imputed rent)':'Homeowners’ housing (estimated rent)', 'Nonprofit institutions serving households':'Nonprofit groups'};
    const pceNodes = pceWRaw.map(r=>({code:r.code, name:PCE_LABELS[r.name]||r.name, parent:r.parent||null, weight:num(r.weight)})).filter(n=>n.weight!=null && n.weight>0);
    const pceWDate = pceWRaw.length && pceWRaw[0].date ? parseDate(pceWRaw[0].date) : null;
    const PCOMP = wideTable(pceCompRaw);

    // ---------- interest rates ----------
    const RATES = [
      {key:'fed_funds', label:'Fed interest rate', short:'Fed rate', cls:'actual'},
      {key:'gs2', label:'2-year Treasury', short:'2-year', cls:'model'},
      {key:'gs10', label:'10-year Treasury', short:'10-year', cls:'c3'},
      {key:'gs30', label:'30-year Treasury', short:'30-year', cls:'c5'},
    ].map(r=>{
      const s = seriesFrom(r.key); if(!s || !s.length) return null;
      const l = s[s.length-1], y = s.find(p=>p.date.getTime()===addMonths(l.date,-12).getTime());
      const fc = rFcRaw.filter(x=>x.series===r.key).map(x=>({date:parseDate(x.date), mean:num(x.mean), lo:num(x.lower), hi:num(x.upper), model:x.model})).filter(x=>x.mean!=null).sort((a,b)=>a.date-b.date);
      return {...r, s, last:l, yearAgo:y, fc, hz:hzParse(rBtRaw.filter(x=>x.series===r.key))};
    }).filter(Boolean);
    const rate = k => RATES.find(r=>r.key===k);

    // side status
    const sideBits = [`<span class="row"><span class="dot"></span>CPI through ${fmtMonth(latest.date)}</span>`];
    if(pceLast) sideBits.push(`<span class="sub">PCE through ${fmtMonth(pceLast.date)}</span>`);
    if(rate('gs10')) sideBits.push(`<span class="sub">Yields through ${fmtMonth(rate('gs10').last.date)}</span>`);
    if(nextText) sideBits.push(`<span class="sub">Next update: ${nextText}</span>`);
    document.getElementById('sideStatus').innerHTML = sideBits.join('');

    const yoyChange = latest.yoy - prev.yoy, gap = latest.yoy - FED_TARGET;
    const COMPONENTS = [
      {key:'core', label:'Core'},
      {key:'food', label:'Food'},
      {key:'energy', label:'Energy'},
      {key:'shelter', label:'Shelter'},
    ];
    const compLatest = COMPONENTS.map(c=>{ const s=compYoY(c.key); return s && s.length ? {...c, v:s[s.length-1].v, date:s[s.length-1].date, series:s} : null; }).filter(Boolean);
    const coreLatest = compLatest.find(c=>c.key==='core');
    const forecastLegend = `<div class="legend"><span><i class="key-line" style="background:var(--c-actual)"></i>Actual</span><span><i class="key-dash" style="border-color:var(--c-model)"></i>Forecast</span><span><i class="key-area" style="background:var(--c-model);opacity:.3"></i>Likely range</span></div>`;
    const rl = k => rate(k) ? rate(k).last : null;
    const fc12 = r => r && r.fc.length ? r.fc[r.fc.length-1] : null;

    // =============== page markup ===============
    const tile = (o) => `<a class="kpi linky" href="${o.href}" style="text-decoration:none;color:inherit;display:block">
        <div class="kpi-label">${o.label}</div><div class="kpi-value num">${o.value}</div>
        <div class="kpi-sub">${o.sub}</div><div class="chart spark" id="${o.spark}"></div></a>`;
    const nextYr = f => f ? `Projected next year: ${f}` : '';
    const ovTiles = [
      {label:'Inflation', value:pct(latest.yoy), sub:nextYr(last12&&pct(last12.mean)), href:'#forecast', spark:'spk-cpi'},
      {label:'Core CPI', value:coreLatest?pct(coreLatest.v):'—', sub:coreLatest?'Excl. food and energy':'Pending data', href:'#drivers', spark:'spk-core'},
      {label:'PCE inflation', value:pceLast?pct(pceLast.v):'—', sub:pceLast?nextYr(pceF.pce.length&&pct(pceF.pce[pceF.pce.length-1].mean)):'Pending data', href:'#pce', spark:'spk-pce'},
      {label:'Core PCE', value:pceLast&&pceLast.core!=null?pct(pceLast.core):'—', sub:pceLast?'The Fed\u2019s preferred gauge':'Pending data', href:'#pce', spark:'spk-pcecore'},
      {label:'Fed interest rate', value:rl('fed_funds')?pct(rl('fed_funds').v,2):'—', sub:rl('fed_funds')?nextYr(fc12(rate('fed_funds'))&&pct(fc12(rate('fed_funds')).mean,2)):'Pending data', href:'#rates', spark:'spk-ff'},
      {label:'10-year Treasury yield', value:rl('gs10')?pct(rl('gs10').v,2):'—', sub:rl('gs10')?nextYr(fc12(rate('gs10'))&&pct(fc12(rate('gs10')).mean,2)):'Pending data', href:'#rates', spark:'spk-10y'},
    ];
    // page title says what the site is; the numbers live in the executive summary below it
    const headline = 'U.S. Economic Forecast';

    const ovDrivers = (()=>{
      if(!hasCats || !COMP.cols.SA0) return null;
      const li = lastIdx(COMP.cols.SA0), head = yoyOf(COMP.cols.SA0)[li];
      const rows = cpiMajor.filter(g=>g.yoy!=null).map(g=>({label:g.name, value:g.weight*g.yoy/100})).sort((a,b)=>b.value-a.value);
      return rows.length ? {head, date:COMP.dates[li], rows} : null;
    })();

    // executive summary: plain-English takeaways for non-economists, rebuilt from the data on every update
    const execSummary = (()=>{
      const rows = [];
      const ok = v => v!=null && isFinite(v);
      if(!latest || !ok(latest.yoy)) return '';
      const above = v => v - FED_TARGET > 0.25 ? 'above' : v - FED_TARGET < -0.25 ? 'below' : 'close to';
      // bottom line, coloured by how far inflation is from the Fed's 2% goal
      const outlookUp = last12 && ok(last12.mean) ? last12.mean - latest.yoy : null;
      const tone = latest.yoy - FED_TARGET > 1 ? 'hot' : latest.yoy - FED_TARGET > 0.25 ? 'warm' : latest.yoy - FED_TARGET < -0.25 ? 'cool' : 'ok';
      // plain wording for how a rate compares with the Fed's goal
      const cmpGoal = v => above(v)==='above' ? 'faster than' : above(v)==='below' ? 'slower than' : 'close to';
      const nextBit = outlookUp==null ? '' : Math.abs(outlookUp)<0.15 ? ', and the model expects them to keep rising at about the same speed over the next year' : outlookUp>0 ? ', and the model expects them to rise a bit faster over the next year' : ', and the model expects them to rise more slowly over the next year';
      // 1. prices today
      let now = `Prices are <b>${pct(latest.yoy)}</b> higher than a year ago (${fmtMonthLong(latest.date)}).`;
      if(prev && ok(prev.yoy)) now += Math.abs(latest.yoy-prev.yoy)<0.05 ? ` That\u2019s the same pace as last month.` : ` Last month it was ${pct(prev.yoy)}, so prices are rising ${latest.yoy>prev.yoy?'faster':'more slowly'}.`;
      rows.push({k:'Prices today', v:now});
      // 3. biggest cause
      const plain = {'Housing':'Housing (rent and home costs)','Food and beverages':'Food','Transportation':'Transportation (cars, gas, fares)','Medical care':'Health care','Education and communication':'Education and phone/internet'};
      if(ovDrivers && ovDrivers.rows.length && ok(ovDrivers.head) && ovDrivers.head>0){
        const top = ovDrivers.rows[0], share = top.value/ovDrivers.head*100;
        if(ok(share) && share>0 && share<=100) rows.push({k:'Biggest cause', v:`<b>${esc(plain[top.label]||top.label)}</b> is the biggest cause. It accounts for about ${share.toFixed(0)}% of the price rise, because it is the largest part of household spending.`});
      }
      // 4. next year
      if(last12 && ok(last12.mean)){
        let t = `In ${fmtMonthLong(last12.date)}, the model expects prices to be about <b>${pct(last12.mean)}</b> higher than a year before, ${cmpGoal(last12.mean)} the Fed\u2019s 2% goal.`;
        if(ok(last12.lo) && ok(last12.hi)) t += ` The 95% likely range is ${pct(Math.max(last12.lo,-5))} to ${pct(last12.hi)}, so the exact number is uncertain.`;
        rows.push({k:'Projected next year', v:t});
      }
      // 5. interest rates
      const ff = rate('fed_funds');
      if(ff && ff.last && ok(ff.last.v) && fc12(ff) && ok(fc12(ff).mean)){
        const d = fc12(ff).mean - ff.last.v;
        const move = Math.abs(d)<0.1 ? 'borrowing costs shouldn\u2019t change much' : d>0 ? 'loans and credit cards may cost a bit more' : 'loans and credit cards may cost a bit less';
        rows.push({k:'Interest rates', v:`The Fed\u2019s interest rate is <b>${pct(ff.last.v,2)}</b>. The model expects it to ${Math.abs(d)<0.1?'stay about the same':`${d>0?'reach':'fall to'} about <b>${pct(fc12(ff).mean,1)}</b> by ${fmtMonthLong(fc12(ff).date)}`}, so ${move}.`});
      }
      // 6. how reliable
      const hz = hzRaw.map(r=>({h:+r.horizon, m:num(r.model_mae), nv:num(r.naive_mae), cov:num(r.coverage_95), n:+r.n})).filter(r=>ok(r.m)&&ok(r.nv)&&r.nv>0&&ok(r.cov)&&r.n>0).sort((a,b)=>a.h-b.h);
      if(hz.length){
        const l = hz[hz.length-1], edge = (1-l.m/l.nv)*100;
        const cov = hz.reduce((s,r)=>s+r.cov*r.n,0)/hz.reduce((s,r)=>s+r.n,0);
        const vs = edge>=1 ? `the model was <b>${edge.toFixed(0)}%</b> more accurate than just repeating today\u2019s inflation rate` : edge<=-1 ? `just repeating today\u2019s inflation rate was ${Math.abs(edge).toFixed(0)}% more accurate than the model` : `the model was about as accurate as just repeating today\u2019s inflation rate`;
        rows.push({k:'How accurate is it?', v:`Tested on past data, ${vs}. The real number landed inside the likely range <b>${cov.toFixed(0)}%</b> of the time.`});
      }
      return `<div class="card exec" aria-labelledby="execTitle">
          <div class="card-head"><div><p class="card-title" id="execTitle">${['','One thing','Two things','Three things','Four things','Five things','Six things','Seven things'][rows.length]||rows.length+' things'} to know</p></div><a class="link-more" href="#findings">Read the story \u2192</a></div>
          <p class="exec-verdict ${tone}"><span class="dot"></span><span><b>Bottom line:</b> prices are rising ${cmpGoal(latest.yoy)} the Fed\u2019s 2% goal${nextBit}.</span></p>
          <dl class="exec-list">${rows.map(r=>`<div class="exec-row"><dt>${r.k}</dt><dd>${r.v}</dd></div>`).join('')}</dl>
          <p class="exec-note">Inflation = how much prices rose over the past 12 months. The Fed is America\u2019s central bank. It aims for prices to rise about 2% a year.</p>
        </div>`;
    })();

    const storyPeak = yoyData.filter(d=>d.date>=parseDate('2021-01-01') && d.date<=parseDate('2023-12-01')).reduce((a,b)=>!a||b.yoy>a.yoy?b:a, null);

    // =============== showcase hero ===============
    const okN = v => v!=null && isFinite(v);
    // the moving wall: every CPI category, coloured by its 12-month change
    const wallItems = (()=>{

    const ffR = rate('fed_funds'), tenR = rate('gs10');

      {l:'Inflation now', v:pct(latest.yoy), c:countAttr(latest.yoy,1), s: prev && okN(prev.yoy) ? (Math.abs(latest.yoy-prev.yoy)<0.05 ? `Same as last month (${pct(prev.yoy)})` : `${latest.yoy>prev.yoy?'Up':'Down'} from ${pct(prev.yoy)} last month`) : fmtMonthLong(latest.date), href:'#forecast'},

    ];
    const heroHTML = `
      <div class="ov-hero">

    // 1) price breakdown: fastest risers and fallers across every category
    const moversTicker = (()=>{

    const pceMoversTicker = (()=>{
      if(!(pceNodes.length && PCOMP)) return '';

      const it = pceNodes.filter(n=>!parents.has(n.code) && n.weight>=0.03).map(n=>{
        const v = PCOMP.cols[n.code]; if(!v) return null; const li = lastIdx(v); if(li<0) return null;
        const y = yoyOf(v)[li]; return okN(y) ? {name:n.name, y} : null;
      }).filter(Boolean).sort((a,b)=>b.y-a.y);
      if(it.length<16) return '';
      const cell = t => `<span class="tk">${esc(t.name)} <b class="${tkCls(t.y)}">${spct(t.y)}</b></span>`;
      return tickerOf([tkHead('Rising fastest'), ...it.slice(0,12).map(cell), tkHead('Falling fastest'), ...it.slice(-12).reverse().map(cell)], 'Fastest rising and falling PCE prices');
    })();

    const ratesTicker = (()=>{

      const two = rate('gs2'), ten = rate('gs10');
      if(two && ten){ const sp = ten.last.v - two.last.v; cells.push(`<span class="tk">10-year vs 2-year gap <b class="${sp<0?'up':'nt'}">${sp>=0?'+':'−'}${Math.abs(sp).toFixed(2)} pts</b>${sp<0?' <i>inverted</i>':''}</span>`); }
      if(ten) cells.push(`<span class="tk">10-year after inflation <b class="nt">${spct(ten.last.v - latest.yoy,2)}</b></span>`);
      return tickerOf([tkHead('Rates now'), ...cells], 'Latest interest rates');
    })();
    // 3) story: a faint, slow version of the hero wall
    const storyBand = (()=>{
      const cell = t => { const b = heatBin(t.y); return `<div class="wtile" style="--tc:var(--h${b});--tt:var(--hi${b})"><span>${esc(t.name)}</span><b>${spct(t.y)}</b></div>`; };
      return `<p class="wall-label">What got pricier (or cheaper) over the past year</p><div class="wall-band" aria-hidden="true">${[0,1,2].map(r=>{ const row = Array.from({length:16},(_,k)=>wallItems[(r*31 + k*11) % wallItems.length]); return `<div class="wall-row">${row.map(cell).join('')}${row.map(cell).join('')}</div>`; }).join('')}</div>`;
    })();
    // 4) your money: what $100 from past years is worth today
    const moneyTicker = (()=>{
      const yrs = {}; data.forEach(d=>{ const y=d.date.getUTCFullYear(); (yrs[y]=yrs[y]||[]).push(d.cpi); });
      const ly = latest.date.getUTCFullYear();
      const pick = [1950,1960,1970,1980,1990,2000,2008,2015,2020,2021,2022,ly-1].filter((y,i,a)=>a.indexOf(y)===i && y<ly && yrs[y] && yrs[y].length===12);
      const cells = pick.map(y=>{ const lvl = yrs[y].reduce((a,b)=>a+b,0)/12; return `<span class="tk">$100 in ${y} <b class="nt">= ${usd(100*latest.cpi/lvl,0)}</b> <i>today</i></span>`; });
      return tickerOf([tkHead('$100 then, today'), ...cells], 'What $100 from past years is worth today', 'slow');
    })();

    // explore cards
    const ICONS = {
      trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
      bars:'<path d="M5 20V11M12 20V4M19 20v-6"/>',

      target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
    };
    const topDriver = ovDrivers && ovDrivers.rows.length ? ovDrivers.rows[0].label : null;
    const xcards = [
      {href:'#forecast', icon:'trend', ic:'var(--c-model)', t:'The forecast', d:'A 12-month inflation forecast, with a likely range around it.', sl:'In 12 months', sv:last12?pct(last12.mean):'—'},
      {href:'#money', icon:'wallet', ic:'var(--c-5)', t:'Your money', d:'What inflation does to your savings, your paycheck and everyday prices.', sl:'$100 a year ago now costs', sv:okN(latest.yoy)?usd(100*(1+latest.yoy/100)):'—'},

    app.innerHTML = `

        <section class="chap" id="ch-why">
          <div class="chap-num">01</div>
          <div class="chap-body">
            <h2 class="chap-title">Why I built this</h2>
            <p class="story-p">Between 2021 and 2022, prices in the U.S. rose faster than at any time in 40 years. At the peak, in <b>${storyPeak?fmtMonthLong(storyPeak.date):'mid-2022'}</b>, prices were <b>${storyPeak?pct(storyPeak.yoy):'9%'} higher</b> than a year before. Groceries, rent and gas all got noticeably more expensive.</p>
            <p class="story-p">The news kept repeating one number: “inflation is high.” But that one number hid the questions I actually cared about:</p>
            <div class="qcards">
              <a class="qcard" href="#drivers"><span class="q">What is pushing prices up?</span><span class="a">See what’s driving inflation →</span></a>
              <a class="qcard" href="#forecast"><span class="q">Where is inflation heading next?</span><span class="a">See the forecast →</span></a>
              <a class="qcard" href="#track-record"><span class="q">Can we trust a forecast?</span><span class="a">See the track record →</span></a>
            </div>
            <p class="story-p">So I built this site to answer them with official government data, a forecasting model that is tested in public, and explanations anyone can follow. It updates itself every day.</p>
            <p class="vision-quote">Make inflation as easy to read as a weather forecast.</p>
            <p class="story-p">One place where anyone, from a shopper to a pricing manager, can see what prices are doing, why, and where they are heading next, with an honest range around every forecast.</p>
          </div>
        </section>


        ${storyBand}
        <section class="chap" id="ch-value">
          <div class="chap-num">02</div>
          <div class="chap-body">
            <h2 class="chap-title">Use cases</h2>
            <p class="story-p">For a <b>pricing team</b>, inflation is two problems at once: your own costs are rising, and so are your customers’ bills. This site turns official data into four everyday decisions.</p>
            <div class="value-grid">
              <a class="value-c" href="#drivers"><span class="vn">01</span><b>Set prices with evidence</b><span>See how fast prices are rising in your exact category, out of ${hasCats?cpiNodes.length-1:160} CPI and ${Math.max(0,pceNodes.length-1)} PCE categories (CPI and PCE are the government’s two ways of measuring prices), and compare it with overall inflation.</span><em>Price breakdown →</em></a>
              <a class="value-c" href="#forecast"><span class="vn">02</span><b>Plan next year’s budget</b><span>Use the 12-month forecast and its likely range to build a base, best and worst case for cost growth.</span><em>Forecast →</em></a>
              <a class="value-c" href="#drivers"><span class="vn">03</span><b>Negotiate with suppliers</b><span>When a supplier asks for an 8% increase, check what that category actually did in official data before you agree.</span><em>Search any category →</em></a>
              <a class="value-c" href="#drivers"><span class="vn">04</span><b>Time price changes</b><span>The “Speeding up?” column and the time slider show whether a category is heating up or cooling down, so you can move before competitors do.</span><em>Price breakdown →</em></a>
            </div>
          </div>
        </section>

        <section class="chap" id="ch-insights">
          <div class="chap-num">03</div>
          <div class="chap-body">
            <h2 class="chap-title">Insights</h2>
            <p class="story-p">Five takeaways for pricing teams, recalculated from the latest data every time this site updates.</p>
            <div class="insights" id="bizInsights">${hasCats?'':pending('Detailed CPI categories')}</div>
            <p class="cnote">Estimates from public data to support your own judgement, not business or investment advice.</p>
          </div>
        </section>

        <section class="chap" id="ch-found">
          <div class="chap-num">04</div>
          <div class="chap-body">
            <h2 class="chap-title">Findings</h2>
            <p class="story-p">I tested the model on years of past data it had never seen, as if I were forecasting live back then. Here is what happened, in plain English. Open “Details” for the numbers.</p>
            <div class="findings-list" id="findingsBody"></div>
          </div>
        </section>

        <section class="chap" id="ch-how">
          <div class="chap-num">05</div>
          <div class="chap-body">
            <h2 class="chap-title">How it works</h2>
            <p class="story-p">Four steps run on their own every day. Nobody types the numbers in by hand.</p>
            <div class="steps story-steps">
              <div class="step-c"><b>Collect the data</b><span>Download the newest official numbers: prices from the Bureau of Labor Statistics and the Bureau of Economic Analysis, interest rates from the Federal Reserve.</span></div>
              <div class="step-c"><b>Learn from the past</b><span>A statistical model studies decades of inflation to learn its patterns. For example, inflation tends to drift back toward its long-run average.</span></div>
              <div class="step-c"><b>Test it honestly</b><span>I went back to past dates, let the model predict using only the data available then, and checked how wrong it was. Every live forecast is also saved and graded when the real number comes out.</span></div>
              <div class="step-c"><b>Publish automatically</b><span>When new data arrives, an automated job re-runs everything and updates this website.</span></div>
            </div>
            <div class="limits"><b>What it can’t do.</b> The model only looks at past inflation. It doesn’t read the news, see oil prices or know what the Fed will say next, so sudden surprises catch it out. Interest rates are even harder, because markets react to news instantly.</div>
            <details class="fold tech"><summary>For the technical reader: models, tests and data sources</summary><div class="fold-body">
        <div class="grid-2 method">
          <div class="card"><h3>CPI</h3><p>Monthly CPI for All Urban Consumers (CPI-U, all items, seasonally adjusted; FRED <code>CPIAUCSL</code>). Inflation is the 12-month percent change of the index.
            BLS did not publish October 2025 CPI because of a federal government shutdown; that month is estimated by drawing a straight line between the months before and after so every year-over-year rate compares the same calendar month a year apart.</p></div>
          <div class="card"><h3>CPI categories and weights</h3><p>About 160 categories of the CPI-U, U.S. city average, not seasonally adjusted, downloaded from the BLS time-series files (<code>download.bls.gov/pub/time.series/cu</code>).
            Weights are BLS <a href="https://www.bls.gov/cpi/tables/relative-importance/" target="_blank" rel="noopener">relative importance</a> as of December 2025, the share of spending each category represents.
            A category's contribution to inflation is approximated as its weight times its 12-month change; because relative importance drifts with prices, contributions do not add up exactly to the headline rate.</p></div>
          <div class="card"><h3>PCE</h3><p>The PCE chain-type price index and 80+ categories from BEA's monthly NIPA tables 2.4.4U (prices) and 2.4.5U (spending).
            PCE weights are each category's share of nominal spending in the latest month. PCE is broader than CPI (it includes spending on households' behalf, such as employer-paid health insurance)
            and uses a chain-type formula, so it typically runs a few tenths below CPI. The Fed's 2% target is defined in terms of PCE.</p></div>
          <div class="card"><h3>Interest rates</h3><p>Monthly averages of the effective federal funds rate and constant-maturity Treasury yields (3-month bill, 2, 5, 10 and 30 years) from the Federal Reserve via FRED.
            The 30-year bond was not issued from February 2002 to January 2006, so its model uses only data after the gap.</p></div>
          <div class="card"><h3>Models</h3><p>CPI: ${esc(modelLabel)} fit to year-over-year inflation, chosen from nine candidate orders by out-of-sample error and benchmarked against just repeating today’s rate, ARIMAX and gradient-boosted trees.
            PCE: ARIMA on year-over-year headline and core PCE inflation, order chosen by AIC.
            Rates: ARIMA(p, 1, q) on the level of each rate since 1990, p and q chosen by AIC. All forecasts run 12 months ahead with a likely range (95% interval).</p></div>
          <div class="card"><h3>Evaluation</h3><ul>
            <li>Rolling-origin backtests: the model is re-fit only on data available at each forecast origin.</li>
            <li>Mean absolute error at 1 to 12 months ahead against just repeating today’s rate, plus how often the real number lands inside the likely range.</li>
            <li>CPI models are compared with the Diebold-Mariano test (Harvey-Leybourne-Newbold correction).</li>
            <li>Every live CPI forecast is archived and graded when the real number comes out.</li></ul></div>
          <div class="card"><h3>Pipeline</h3>
            <p>A GitHub Actions job runs daily, downloads new data from FRED, BLS and BEA, re-runs the models when new data lands and redeploys this static site.</p>
            <div class="pipeline"><span class="step">FRED · BLS · BEA</span><span class="arrow">→</span><span class="step">Python · pandas · statsmodels · scikit-learn</span><span class="arrow">→</span><span class="step">CSV</span><span class="arrow">→</span><span class="step">This site</span></div></div>
          <div class="card"><h3>Limitations</h3><p>Univariate ARIMA models use only each series' own past. They do not see energy prices, wages, Fed communication or the economic outlook, and tend to lag turning points.
            Interest rates are close to a random walk, so just repeating today’s rate is very hard to beat; the value of the rate model lies mainly in its likely ranges.</p></div>
        </div>
        <h3 class="tech-h">Data sources</h3>
        <div class="card" style="overflow-x:auto"><table>
          <thead><tr><th>Series</th><th>ID</th><th>Source</th></tr></thead>
          <tbody>
            ${[['CPI, all items','CPIAUCSL','BLS'],['CPI less food & energy (core)','CPILFESL','BLS'],['CPI food, energy, shelter','CPIUFDSL, CPIENGSL, CUSR0000SAH1','BLS'],
               ['Average hourly earnings, production & nonsupervisory','AHETPI','BLS'],['Effective federal funds rate','FEDFUNDS','Federal Reserve'],
               ['Treasury yields: 3-month, 2, 5, 10, 30 years','TB3MS, GS2, GS5, GS10, GS30','Federal Reserve'],['10-year TIPS yield','DFII10','Federal Reserve'],['30-year mortgage rate','MORTGAGE30US','Freddie Mac'],
               ['10-year breakeven inflation rate','T10YIE','Federal Reserve Bank of St. Louis'],
               ['PCE price index, headline and core','PCEPI, PCEPILFE','BEA']]
              .map(r=>`<tr><td>${r[0]}</td><td>${r[1].split(', ').map(id=>`<a href="https://fred.stlouisfed.org/series/${id}" target="_blank" rel="noopener"><code>${id}</code></a>`).join(' ')}</td><td class="muted">${r[2]}</td></tr>`).join('')}
            <tr><td>CPI categories (≈160) and average prices (24 items)</td><td><a href="https://download.bls.gov/pub/time.series/cu/" target="_blank" rel="noopener"><code>cu</code></a> <a href="https://download.bls.gov/pub/time.series/ap/" target="_blank" rel="noopener"><code>ap</code></a></td><td class="muted">BLS</td></tr>
            <tr><td>CPI relative importance (weights), December 2025</td><td><a href="https://www.bls.gov/cpi/tables/relative-importance/2025.htm" target="_blank" rel="noopener"><code>data/cpi_weights.csv</code></a></td><td class="muted">BLS</td></tr>
            <tr><td>PCE prices and spending by category</td><td><a href="https://apps.bea.gov/iTable/?reqid=19&amp;step=2&amp;isuri=1&amp;categories=survey" target="_blank" rel="noopener"><code>NIPA 2.4.4U, 2.4.5U</code></a></td><td class="muted">BEA</td></tr>
          </tbody></table></div>

            </div></details>
          </div>
        </section>

        <section class="chap" id="ch-next">
          <div class="chap-num">06</div>
          <div class="chap-body">
            <h2 class="chap-title">What’s next</h2>
            <p class="story-p">The model is deliberately simple today. These are the upgrades I want to try.</p>
            <div class="next-grid">
              <div class="next-c"><b>Forecast the big pieces separately</b><span>Give rent, food, energy, goods and services their own forecasts, then add them up using each one’s share of spending.</span></div>
              <div class="next-c"><b>Add early-warning signals</b><span>Prices businesses pay, import prices, wages and new rents often move before consumer prices do.</span></div>
              <div class="next-c"><b>Connect interest rates to inflation</b><span>Forecast all the interest rates together and let them react to the inflation forecast.</span></div>
              <div class="next-c"><b>Compare with the professionals</b><span>Grade my forecasts against the Cleveland Fed and professional forecasters, not just a simple guess.</span></div>
            </div>
          </div>
        </section>
        ${pageFoot()}
      </section>

      <!-- ================= CPI FORECAST ================= -->
      <section class="page" id="page-forecast" data-title="CPI forecast">
        <div class="eyebrow"><span class="pill"><span class="dot"></span>Data through ${fmtMonthLong(latest.date)}</span>${nextText?`<span class="pill">Next update: ${nextText}</span>`:''}<span>CPI: the government’s main measure of consumer prices</span></div>
        <h1>Next year, prices should rise about ${pct(last12.mean)}</h1>
        <p class="lede">Prices are rising ${pct(latest.yoy)} a year today. By ${fmtMonthLong(last12.date)}, the model projects ${pct(last12.mean)}. The shaded area on the chart shows where it will probably land.</p>
        <div class="grid-3">
          <div class="kpi"><div class="kpi-label">Inflation today</div><div class="kpi-value num">${pct(latest.yoy)}</div><div class="kpi-sub">${fmtMonth(latest.date)}</div></div>
          <div class="kpi"><div class="kpi-label">Projected next month</div><div class="kpi-value num">${pct(next.mean)}</div><div class="kpi-sub">${fmtMonth(next.date)}</div></div>
          <div class="kpi"><div class="kpi-label">Projected next year</div><div class="kpi-value num">${pct(last12.mean)}</div><div class="kpi-sub">${fmtMonth(last12.date)}</div></div>
        </div>
        <div class="card" style="margin-top:12px">
          <div class="card-head">
            <div><p class="card-title">Inflation and forecast</p><p class="card-sub">The shaded area gets wider over time, because guessing next year is harder than guessing next month.</p></div>
            ${segControl('ovRange', [{v:'36',label:'3Y'},{v:'60',label:'5Y'},{v:'120',label:'10Y'},{v:'0',label:'All'}], '36')}
          </div>
          ${forecastLegend}
          <div class="chart" id="ovChart"></div>
        </div>
        <div class="grid-2" style="margin-top:12px">
          <div class="card">
            <p class="card-title">Forecast by month</p>
            <p class="card-sub">The model’s best guess and the likely range for each month.</p>
            <table><thead><tr><th>Month</th><th class="r">Forecast</th><th class="r">Likely range</th></tr></thead>
              <tbody>${forecast.map(r=>`<tr><td>${fmtMonth(r.date)}</td><td class="r">${pct(r.mean)}</td><td class="r muted">${pct(r.lo)} – ${pct(r.hi)}</td></tr>`).join('')}</tbody></table>
          </div>
          <div class="stack">
            <div class="card">
              <p class="card-title">How to read the likely range</p>
              <p class="card-sub" style="margin-bottom:0">The real inflation rate should land inside the shaded range about 95% of the time (19 times out of 20). The best guess stays flat because the model has no way to know what will push prices up or down later.
              The range widens because each month's forecast builds on the one before, so small errors add up. By ${fmtMonth(last12.date)} it spans
              ${(last12.hi-last12.lo).toFixed(1)} points (${pct(last12.lo)} to ${pct(last12.hi)}): the model is honest that it cannot see a year ahead precisely.</p>
            </div>
            <div class="card">
              <div class="card-head"><p class="card-title">The model vs the bond market</p><a class="link-more" href="#expectations">Compare →</a></div>
              <p class="card-sub" style="margin-bottom:0" id="fcExpect"></p>
            </div>
            <div class="card">
              <div class="card-head"><p class="card-title">CPI vs PCE forecast</p><a class="link-more" href="#pce">PCE →</a></div>
              <p class="card-sub" style="margin-bottom:0">${pceF.pce.length?`PCE inflation, the Fed's target measure, is forecast at <b style="color:var(--ink)">${pct(pceF.pce[pceF.pce.length-1].mean)}</b> by ${fmtMonth(pceF.pce[pceF.pce.length-1].date)}, against ${pct(last12.mean)} for CPI.`:'The PCE forecast will appear after the next data update.'}</p>
            </div>
          </div>
        </div>
        ${pageFoot()}
      </section>

      <!-- ================= TRACK RECORD ================= -->
      <section class="page" id="page-track-record" data-title="Track record">
        <h1 class="page-title">Track record</h1>
        <p class="lede">For ${errModel.length?`each of the last ${errModel.length} months`:'each recent month'}, the model forecast the next month’s inflation using only what it knew at the time. Then the real number came out. Here’s how close it got.</p>
        <div class="grid-3" id="callouts"></div>
        <div class="card" style="margin-top:12px" ${hasErrors?'':'hidden'}>
          <p class="card-title">How far off each forecast was</p>
          <p class="card-sub">Above zero means the forecast was too low, below zero means too high. The closer to zero, the better.</p>
          <div class="legend"><span><i class="key-line" style="background:var(--c-model)"></i>This model</span><span><i class="key-line" style="background:var(--c-ref)"></i>Just repeating today’s rate</span></div>
          <div class="chart" id="errChart"></div>
        </div>
        <h2>How accurate is it further ahead?</h2>
        <p class="sec-sub">The same test for forecasts 1 to 12 months ahead, plus a check on the likely range: how often the real number landed inside it.</p>
        <div class="card" id="horizonCard"></div>
        <h2>Live scorecard</h2>
        <p class="sec-sub">Testing on past data replays history. The scorecard is different: each forecast is saved on the day it is published, then graded when the real CPI number comes out.</p>
        <div class="card" id="archiveCard"></div>
        <details class="fold tech"><summary>For the technical reader: model comparison and statistical tests</summary><div class="fold-body">
          <div class="card">
            <p class="card-title">Which version of the model works best</p>
            <p class="card-sub">Average miss of one-month-ahead forecasts over the last ${errModel.length||24} months, in percentage points. Lower is better. RMSE (root mean squared error) is a second score that penalises big misses more heavily.</p>
            <div id="leaderboard"></div>
          </div>
          <h2>Model competition</h2>
          <p class="sec-sub">Four models forecast the same months, one month ahead, each using only the data available at the time. The last column checks whether a model’s edge over just repeating today’s rate is real or could be luck (a Diebold-Mariano test).</p>
          <div class="card" id="benchCard"></div>
        </div></details>
        ${pageFoot()}
      </section>

    `;
    // ---- overview chart ----
    let ovMonths = 36;

    }
    const ovEl = document.getElementById('ovChart');
    mount(ovEl, el=>lineChart(forecastCfg(ovMonths ? yoyData.slice(-ovMonths) : yoyData))(el));
    bindSeg('ovRange', v=>{ ovMonths=+v; ovEl.__draw(ovEl); });


    // ---- track record ----
    const callouts = document.getElementById('callouts');
    if(hasErrors){
      let wins=0; errModel.forEach((e,i)=>{ if(e.abs < errNaive[i].abs) wins++; });
      const worst = errModel.reduce((a,b)=>b.abs>a.abs?b:a);
      callouts.innerHTML = `
        <div class="kpi"><div class="kpi-label">Average miss, last ${errModel.length||24} months</div><div class="kpi-value num">${model.mae.toFixed(2)} <small>points</small></div><div class="kpi-sub">Just repeating today’s rate: ${naive.mae.toFixed(2)} points</div></div>
        <div class="kpi"><div class="kpi-label">Closer than repeating today’s rate</div><div class="kpi-value num">${wins} <small>of ${errModel.length} months</small></div><div class="kpi-sub">Months the model’s forecast was closer to the real number</div></div>
        <div class="kpi"><div class="kpi-label">Biggest miss</div><div class="kpi-value num">${worst.error>=0?"+":"−"}${Math.abs(worst.error).toFixed(2)} <small>points</small></div><div class="kpi-sub">${fmtMonthLong(worst.date)}: forecast ${pct(worst.forecast,2)}, actual ${pct(worst.actual,2)}</div></div>`;
      mount(document.getElementById('errChart'), lineChart({
        aria:'Monthly forecast error', height:260, dates: errModel.map(e=>e.date),
        series:[{label:'Just repeating today’s rate', cls:'ref', values: errNaive.map(e=>e.error)}, {label:'This model', cls:'model', values: errModel.map(e=>e.error)}],
        zeroLine:true, yFmt:(v,d)=>(v>0?'+':'')+v.toFixed(d), tipFmt:v=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(2)+' points',
      }));
    } else if(model && naive){
      callouts.innerHTML = `
        <div class="kpi"><div class="kpi-label">Average miss, last ${errModel.length||24} months</div><div class="kpi-value num">${model.mae.toFixed(2)} <small>points</small></div><div class="kpi-sub">${esc(modelLabel)}</div></div>
        <div class="kpi"><div class="kpi-label">Just repeating today’s rate</div><div class="kpi-value num">${naive.mae.toFixed(2)} <small>points</small></div><div class="kpi-sub">Assumes next month = this month</div></div>
        <div class="kpi"><div class="kpi-label">Improvement</div><div class="kpi-value num">${maeGain.toFixed(0)}%</div><div class="kpi-sub">Lower average error</div></div>`;
    }
    const sorted = bt.slice().sort((a,b)=>a.mae-b.mae), maxMae = Math.max(...sorted.map(r=>r.mae));
    document.getElementById('leaderboard').innerHTML = `<div class="hbars"><div class="hb-row wide hb-head"><span>Model</span><span></span><span class="hb-v">Avg miss</span><span class="hb-v hb-rmse">RMSE</span></div>` +
      sorted.map(r=>{
        const isM = model && r.model===model.model, isN = /naive/i.test(r.model);
