<style>
  :root{
    color-scheme: light;
    --page:#f7f7f5; --surface:#ffffff; --side:#f1f0ec;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --grid:#ebeae4; --axis:#c3c2b7; --border:rgba(11,11,11,.09);
    --c-actual:#2a78d6; --c-model:#eb6834; --c-3:#1baf7a; --c-4:#4a3aa7; --c-ref:#9a9892;
    --c-good:#006300; --c-bad:#b42318;
    --c-5:#eda100; --c-6:#e87ba4; --c-7:#008300; --c-8:#e34948;
    /* diverging heat scale for inflation rates: blue (below target) - gray (near 2%) - red (high) */
    --h0:#104281; --h1:#2a78d6; --h2:#9ec5f4; --h3:#e6e4de; --h4:#f6bfae; --h5:#e5735a; --h6:#b42318;
    --hi0:#fff; --hi1:#fff; --hi2:#0b0b0b; --hi3:#0b0b0b; --hi4:#0b0b0b; --hi5:#0b0b0b; --hi6:#fff;
    --band-opacity:.13;
    --sans:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --page:#0f0f0e; --surface:#1a1a19; --side:#141413;
      --ink:#ffffff; --ink-2:#c3c2b7; --muted:#8f8d86;
      --grid:#2c2c2a; --axis:#44443f; --border:rgba(255,255,255,.09);
      --c-actual:#3987e5; --c-model:#d95926; --c-3:#199e70; --c-4:#9085e9; --c-ref:#77756f;
      --c-good:#0ca30c; --c-bad:#e66767; --band-opacity:.16;
      --c-5:#c98500; --c-6:#d55181; --c-7:#0f9a0f; --c-8:#e66767;
      --h0:#184f95; --h1:#3987e5; --h2:#5f8fc4; --h3:#3b3b42; --h4:#7a3a2c; --h5:#c2452b; --h6:#ff8f7a;
      --hi0:#fff; --hi1:#fff; --hi2:#0b0b0b; --hi3:#fff; --hi4:#fff; --hi5:#fff; --hi6:#1a0d0a;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page:#0f0f0e; --surface:#1a1a19; --side:#141413;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#8f8d86;
    --grid:#2c2c2a; --axis:#44443f; --border:rgba(255,255,255,.09);
    --c-actual:#3987e5; --c-model:#d95926; --c-3:#199e70; --c-4:#9085e9; --c-ref:#77756f;
    --c-good:#0ca30c; --c-bad:#e66767; --band-opacity:.16;
    --c-5:#c98500; --c-6:#d55181; --c-7:#0f9a0f; --c-8:#e66767;
    --h0:#184f95; --h1:#3987e5; --h2:#5f8fc4; --h3:#3b3b42; --h4:#7a3a2c; --h5:#c2452b; --h6:#ff8f7a;
    --hi0:#fff; --hi1:#fff; --hi2:#0b0b0b; --hi3:#fff; --hi4:#fff; --hi5:#fff; --hi6:#1a0d0a;
  }

  *{box-sizing:border-box;}
  body{margin:0; background:var(--page); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased; font-feature-settings:"cv11";}
  a{color:inherit;}
  .num{font-variant-numeric:tabular-nums;}

  /* ---------- shell: sidebar + content ---------- */
  .shell{display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100vh;}
  .side{position:sticky; top:0; height:100vh; overflow-y:auto; background:var(--side); border-right:1px solid var(--border); padding:22px 14px; display:flex; flex-direction:column; gap:22px;}
  .brand{display:flex; align-items:center; gap:10px; font-weight:600; font-size:14.5px; letter-spacing:-.01em; text-decoration:none; padding:0 8px; white-space:nowrap;}
  .brand-mark{width:24px; height:24px; border-radius:7px; background:var(--c-actual); display:grid; place-items:center; flex:none;}
  .nav-group{display:flex; flex-direction:column; gap:1px;}
  .nav-label{font-size:11.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); padding:0 10px 6px;}
  .nav-link{display:flex; align-items:center; gap:10px; font-size:14px; color:var(--ink-2); text-decoration:none; padding:7px 10px; border-radius:8px; white-space:nowrap;}
  .nav-link:hover{background:var(--border); color:var(--ink);}
  .nav-link[aria-current="page"]{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:0 0 0 1px var(--border);}
  .nav-link svg{flex:none; opacity:.75;}
  .side-foot{margin-top:auto; font-size:12px; color:var(--muted); padding:0 10px; display:grid; gap:8px;}
  .side-foot a{display:inline-flex; align-items:center; gap:6px; color:var(--ink-2); text-decoration:none;}
  .side-foot a:hover{color:var(--ink);}
  .status{display:grid; gap:2px; line-height:1.4;}
  .status .row{display:flex; align-items:center; gap:6px;}
  .status .dot{width:7px; height:7px; border-radius:50%; background:var(--c-good); flex:none;}
  .status .sub{padding-left:13px;}

  .content{min-width:0; width:100%; max-width:2200px; padding:40px clamp(20px, 3vw, 56px) 64px;}
  .page{display:none;}
  .page.active{display:block; animation:fade .18s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  /* ---------- page headers ---------- */
  .eyebrow{font-size:13px; font-weight:500; color:var(--ink-2); display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; padding:3px 10px; border-radius:999px; background:var(--surface); border:1px solid var(--border); color:var(--ink-2);}
  .pill .dot{width:7px; height:7px; border-radius:50%; background:var(--c-good);}
  h1{font-size:clamp(26px, 3.2vw, 34px); line-height:1.2; letter-spacing:-.011em; font-weight:600; margin:14px 0 10px; max-width:24em; text-wrap:balance;}
  .meta{display:flex; flex-wrap:wrap; align-items:center; gap:4px 14px; font-size:13px; color:var(--muted); margin:0;}
  .meta span{display:inline-flex; align-items:center; gap:7px;}
  .meta span + span::before{content:""; width:3px; height:3px; border-radius:50%; background:currentColor; opacity:.6; margin-right:7px;}
  .meta .dot{width:7px; height:7px; border-radius:50%; background:var(--c-good);}
  .meta b{font-weight:500; color:var(--ink-2);}
  .page-title{font-size:clamp(24px, 2.6vw, 30px); letter-spacing:-.011em; font-weight:600; margin:0 0 6px;}
  .lede{font-size:16px; color:var(--ink-2); max-width:740px; margin:0 0 26px; text-wrap:pretty;}
  .lede b{color:var(--ink); font-weight:600;}
  h2{font-size:19px; letter-spacing:-.006em; margin:30px 0 4px; font-weight:600;}
  .sec-sub{color:var(--ink-2); font-size:14px; margin:0 0 12px; max-width:760px;}

  /* ---------- cards & grids ---------- */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px;}
  .stack > * + *{margin-top:12px;}
  .card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;}
  .card-title{font-size:15px; font-weight:600; margin:0;}
  .card-sub{font-size:13px; color:var(--ink-2); margin:2px 0 12px;}
  .grid-2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;}
  .grid-3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px;}
  .grid-4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px;}
  .link-more{font-size:13px; font-weight:500; color:var(--c-actual); text-decoration:none; white-space:nowrap;}
  .link-more:hover{text-decoration:underline;}

  /* ---------- executive summary ---------- */
  .exec{margin:0 0 12px;}
  .exec-list{display:grid; margin:0; border-top:1px solid var(--border);}
  .exec-row{display:grid; grid-template-columns:140px minmax(0,1fr); gap:16px; padding:12px 0; border-bottom:1px solid var(--border);}
  .exec-row:last-child{border-bottom:0; padding-bottom:0;}
  .exec-row dt{font-size:14px; font-weight:600; color:var(--ink);}
  .exec-row dd{margin:0; font-size:15px; color:var(--ink-2);}
  .exec-row dd b{color:var(--ink); font-weight:600;}
  @media (max-width: 560px){ .exec-row{grid-template-columns:1fr; gap:2px;} }
  .exec-verdict{display:flex; gap:10px; align-items:flex-start; margin:0 0 14px; padding:12px 14px; border-radius:10px; background:var(--page); border:1px solid var(--border); font-size:15px; color:var(--ink-2);}
  .exec-verdict b{color:var(--ink);}
  .exec-verdict .dot{flex:none; width:10px; height:10px; border-radius:50%; margin-top:7px; background:var(--c-ref);}
  .exec-verdict.hot .dot{background:var(--c-bad);} .exec-verdict.warm .dot{background:var(--c-5);} .exec-verdict.ok .dot{background:var(--c-good);} .exec-verdict.cool .dot{background:var(--c-actual);}
  .exec-note{margin:12px 0 0; font-size:12.5px; color:var(--muted);}

  /* ---------- KPI tiles ---------- */
  .kpi{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px 18px; min-width:0;}
  .kpi-label{font-size:13px; color:var(--ink-2); font-weight:500;}
  .kpi-value{font-size:28px; font-weight:600; letter-spacing:-.011em; margin-top:6px; line-height:1.1;}
  .kpi-value small{font-size:14px; font-weight:500; color:var(--ink-2); letter-spacing:0;}
  .kpi-sub{font-size:12.5px; color:var(--muted); margin-top:6px;}
  .kpi.hero .kpi-value{font-size:42px;}
  .up-bad{color:var(--c-bad);} .down-good{color:var(--c-good);}
  .key-swatch{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:0;}

  /* ---------- controls ---------- */
  .seg{display:inline-flex; background:var(--page); border:1px solid var(--border); border-radius:10px; padding:3px; gap:2px;}
  .seg button{font:inherit; font-size:13px; font-weight:500; border:0; background:none; color:var(--ink-2); padding:4px 11px; border-radius:7px; cursor:pointer;}
  .seg button:hover{color:var(--ink);}
  .seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface);}
  .field{display:grid; gap:4px; font-size:12.5px; color:var(--ink-2); font-weight:500;}
  .field input, .field select{font:inherit; font-size:15px; color:var(--ink); background:var(--page); border:1px solid var(--border); border-radius:9px; padding:8px 10px; min-width:0;}
  .field input:focus, .field select:focus{outline:2px solid var(--c-actual); outline-offset:1px;}

  /* ---------- charts ---------- */
  .legend{display:flex; flex-wrap:wrap; gap:16px; font-size:12.5px; color:var(--ink-2); margin:0 0 10px;}
  .legend span{display:inline-flex; align-items:center; gap:7px;}
  .key-line{width:16px; height:2px; border-radius:1px; display:inline-block;}
  .key-dash{width:16px; height:0; border-top:2px dashed; display:inline-block;}
  .key-area{width:14px; height:10px; border-radius:2px; display:inline-block;}
  .chart{position:relative; width:100%;}
  .chart svg{display:block; width:100%; overflow:visible;}
  .chart text{font-family:var(--sans); font-size:12px; fill:var(--muted); font-variant-numeric:tabular-nums;}
  .chart .grid line{stroke:var(--grid); stroke-width:1;}
  .chart .baseline{stroke:var(--axis); stroke-width:1;}
  .chart .ref{stroke:var(--c-ref); stroke-width:1; stroke-dasharray:3 3;}
  .chart .ref-label{fill:var(--ink-2); font-size:11.5px;}
  .chart .s{fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round;}
  .chart .s-actual{stroke:var(--c-actual);} .chart .s-model{stroke:var(--c-model);} .chart .s-c3{stroke:var(--c-3);} .chart .s-c4{stroke:var(--c-4);} .chart .s-ref{stroke:var(--c-ref);}
  .chart .s-c5{stroke:var(--c-5);} .chart .s-c6{stroke:var(--c-6);} .chart .s-c7{stroke:var(--c-7);} .chart .s-c8{stroke:var(--c-8);}
  .chart .dashed{stroke-dasharray:5 4;}
  .chart .band-model{fill:var(--c-model); opacity:var(--band-opacity);}
  .chart .area-actual{fill:var(--c-actual); opacity:.08;}
  .chart .dot-actual{fill:var(--c-actual);} .chart .dot-model{fill:var(--c-model);} .chart .dot-c3{fill:var(--c-3);} .chart .dot-c4{fill:var(--c-4);} .chart .dot-ref{fill:var(--c-ref);}
  .chart .dot-c5{fill:var(--c-5);} .chart .dot-c6{fill:var(--c-6);} .chart .dot-c7{fill:var(--c-7);} .chart .dot-c8{fill:var(--c-8);}
  .chart .ring{stroke:var(--surface); stroke-width:2;}
  .chart .bar-actual{fill:var(--c-actual);}
  .chart .bar-actual.hover{opacity:.75;}
  .chart .xhair{stroke:var(--axis); stroke-width:1;}
  .chart .end-label{font-size:12.5px; font-weight:600; fill:var(--ink); stroke:var(--surface); stroke-width:4px; paint-order:stroke; stroke-linejoin:round;}
  .chart .ev-dot{fill:var(--ink); stroke:var(--surface); stroke-width:2;}
  .chart .ev-label{fill:var(--ink-2); font-size:11.5px; font-weight:500;}
  .chart .ev-line{stroke:var(--axis); stroke-width:1;}
  .tip{position:absolute; pointer-events:none; background:var(--surface); border:1px solid var(--border); box-shadow:0 6px 20px rgba(0,0,0,.12); border-radius:10px; padding:8px 11px; font-size:12.5px; min-width:150px; z-index:5; opacity:0; transition:opacity .08s;}
  .tip .t-date{color:var(--ink-2); font-size:12px; margin-bottom:4px;}
  .tip .t-row{display:flex; align-items:center; gap:10px; justify-content:space-between;}
  .tip .t-row b{font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .tip .t-key{display:inline-flex; align-items:center; gap:6px; color:var(--ink-2);}
  .tip .t-note{color:var(--ink); font-weight:500; margin-top:4px;}
  .empty{font-size:13.5px; color:var(--ink-2); background:var(--page); border:1px dashed var(--border); border-radius:10px; padding:18px; text-align:center;}

  /* ---------- horizontal bars (HTML) ---------- */
  .hbars{display:grid; gap:7px;}
  .hb-row{display:grid; grid-template-columns:96px 1fr 64px; align-items:center; gap:12px; font-size:13px;}
  .hb-row.wide{grid-template-columns:190px 1fr 64px 64px;}
  .hb-head{font-size:12px; color:var(--muted);}
  .hb-name{white-space:nowrap; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis;}
  .hb-row.em .hb-name{color:var(--ink); font-weight:600;}
  .hb-track{height:14px; position:relative;}
  .hb-bar{position:absolute; top:0; height:14px; background:var(--grid); border-radius:4px;}
  .hb-bar.pos{border-radius:0 4px 4px 0;} .hb-bar.neg{border-radius:4px 0 0 4px;}
  .hb-bar.c-actual{background:var(--c-actual);} .hb-bar.c-model{background:var(--c-model);} .hb-bar.c-ref{background:var(--c-ref);} .hb-bar.c-ink{background:var(--ink);}
  .hb-zero{position:absolute; top:-3px; bottom:-3px; width:1px; background:var(--axis);}
  .hb-v{text-align:right; font-variant-numeric:tabular-nums;}
  .tag{font-size:10.5px; font-weight:600; letter-spacing:.02em; padding:1px 6px; border-radius:5px; margin-left:6px; vertical-align:1px; border:1px solid var(--border); color:var(--ink-2);}

  /* ---------- findings ---------- */
  .finding{display:grid; grid-template-columns:44px 1fr; gap:14px; align-items:start;}
  .finding .n{width:32px; height:32px; border-radius:9px; background:var(--page); border:1px solid var(--border); display:grid; place-items:center; font-weight:600; font-size:14px; color:var(--ink-2);}
  .finding h3{font-size:16.5px; font-weight:600; letter-spacing:-.01em; margin:4px 0 6px;}
  .finding p{margin:0; color:var(--ink-2); font-size:14.5px;}
  .finding .stat{display:inline-block; font-size:13px; font-weight:600; color:var(--ink); background:var(--page); border:1px solid var(--border); border-radius:7px; padding:2px 8px; margin-top:10px;}
  .finding .more{display:inline-block; margin-top:10px; margin-left:8px;}
  .eyebrow, .sec-sub, .note{display:none;}
  details.fold{margin-top:20px;}
  details.fold > summary{cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:500; color:var(--ink-2); padding:8px 14px; border:1px solid var(--border); border-radius:999px; background:var(--surface);}
  details.fold > summary::-webkit-details-marker{display:none;}
  details.fold > summary::after{content:"+"; font-size:15px; line-height:1;}
  details.fold[open] > summary::after{content:"−";}
  details.fold > .fold-body{margin-top:4px;}
  .subtabs{display:flex; flex-wrap:wrap; gap:4px; margin:0 0 18px; padding:3px; background:var(--surface); border:1px solid var(--border); border-radius:10px; width:fit-content; max-width:100%;}
  .subtabs a{font-size:13.5px; font-weight:500; color:var(--ink-2); text-decoration:none; padding:5px 12px; border-radius:7px; white-space:nowrap;}
  .subtabs a[aria-current="page"]{background:var(--ink); color:var(--page);}
  .findings-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(380px, 1fr)); gap:12px;}
  .finding h3{font-size:17px;}
  .finding p.short{color:var(--ink-2); font-size:15px;}
  .finding .f-foot{display:flex; align-items:center; gap:16px; margin-top:12px; font-size:13px;}
  .finding details summary{cursor:pointer; color:var(--ink-2); font-weight:500; list-style:none;}
  .finding details summary::-webkit-details-marker{display:none;}
  .finding details[open]{flex-basis:100%;}
  .finding details p{font-size:13.5px; margin-top:8px;}
  .finding .f-foot:has(details[open]){flex-wrap:wrap;}
  @media (max-width: 560px){ .findings-grid{grid-template-columns:1fr;} }
  .bm-table td.model{font-weight:500;} .bm-table tr.em td{background:color-mix(in srgb, var(--c-model) 7%, transparent);}
  .bm-bar{display:inline-block; height:8px; border-radius:0 4px 4px 0; background:var(--grid); vertical-align:middle; margin-right:8px;}
  .bm-bar.c-model{background:var(--c-model);} .bm-bar.c-ref{background:var(--c-ref);}

  /* ---------- horizon accuracy ---------- */
  .hz-row{display:grid; grid-template-columns:78px 1fr 96px; gap:14px; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .hz-row:last-child{border-bottom:0;}
  .hz-head{font-size:12px; color:var(--muted); padding-top:0;}
  .hz-bars{display:grid; gap:4px;}
  .hz-bar{display:flex; align-items:center; gap:8px;}
  .hz-bar .b{height:8px; border-radius:0 4px 4px 0; flex:none;}
  .hz-bar .b.model{background:var(--c-model);} .hz-bar .b.naive{background:var(--c-ref);}
  .hz-bar span.v{font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--ink-2);}
  .hz-cov{text-align:right; font-variant-numeric:tabular-nums;}

  /* ---------- price cards ---------- */
  .price-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px 10px; text-align:left; font:inherit; color:inherit; cursor:pointer; min-width:0;}
  .price-card:hover{border-color:var(--axis);}
  .price-card[aria-pressed="true"]{box-shadow:0 0 0 2px var(--c-actual); border-color:transparent;}
  .price-card .p-name{font-size:13.5px; font-weight:600;}
  .price-card .p-unit{font-size:12px; color:var(--muted);}
  .price-card .p-val{font-size:24px; font-weight:600; letter-spacing:-.011em; margin-top:6px;}
  .price-card .p-chg{font-size:12.5px; font-weight:500;}
  .price-card .chart{margin-top:6px;}

  /* ---------- tables ---------- */
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-weight:500; color:var(--muted); font-size:12.5px; padding:8px 10px; border-bottom:1px solid var(--border);}
  td{padding:9px 10px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums;}
  tr:last-child td{border-bottom:0;}
  th.r, td.r{text-align:right;}
  .muted{color:var(--ink-2);}
  details.more{margin-top:14px; border-top:1px solid var(--border); padding-top:10px;}
  details.more summary{cursor:pointer; font-size:13.5px; font-weight:500; color:var(--ink-2); list-style:none; display:flex; align-items:center; gap:6px;}
  details.more summary::-webkit-details-marker{display:none;}
  details.more summary::before{content:"›"; display:inline-block; transition:transform .15s; font-size:16px; line-height:1;}
  details.more[open] summary::before{transform:rotate(90deg);}
  .scroll{max-height:360px; overflow:auto; margin-top:10px;}

  /* ---------- calculator ---------- */
  .calc-inputs{display:grid; grid-template-columns:1.2fr 1fr 1fr; gap:10px; margin-bottom:16px;}
  .calc-result{font-size:clamp(20px, 2.4vw, 26px); font-weight:600; letter-spacing:-.01em; line-height:1.3;}
  .calc-result .big{color:var(--c-actual);}

  /* ---------- methodology ---------- */
  .method h3{font-size:14.5px; margin:0 0 6px; font-weight:600;}
  .method p, .method li{font-size:14px; color:var(--ink-2); margin:0;}
  .method ul{padding-left:18px; margin:0; display:grid; gap:4px;}
  .method code{overflow-wrap:anywhere; word-break:break-word;}
  code{font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:.88em; background:var(--border); padding:1px 5px; border-radius:5px;}
  .pipeline{display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:12.5px; margin-top:10px;}
  .pipeline .step{background:var(--page); border:1px solid var(--border); border-radius:8px; padding:4px 9px; color:var(--ink);}
  .pipeline .arrow{color:var(--muted);}

  .page-foot{margin-top:40px; padding-top:16px; border-top:1px solid var(--border); font-size:12.5px; color:var(--muted); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .loading, .error{padding:80px 24px; text-align:center; color:var(--ink-2);}
  .error{color:var(--c-bad);}


  /* ---------- treemap explorer ---------- */
  .crumbs{display:flex; flex-wrap:wrap; align-items:center; gap:4px; font-size:13.5px; margin:0 0 10px;}
  .crumbs button{font:inherit; border:0; background:none; color:var(--c-actual); cursor:pointer; padding:2px 4px; border-radius:6px;}
  .crumbs button:hover{background:var(--border);}
  .crumbs .cur{font-weight:600; color:var(--ink); padding:2px 4px;}
  .crumbs .sep{color:var(--muted);}
  .tm{position:relative; width:100%; border-radius:10px; overflow:hidden; background:var(--surface);}
  .tm-tile{position:absolute; box-sizing:border-box; border:0; margin:0; padding:10px 12px; text-align:left; font:inherit; cursor:pointer; overflow:hidden;
    border-radius:6px; display:flex; flex-direction:column; justify-content:flex-start; gap:1px; transition:filter .1s;}
  .tm-tile:hover{filter:brightness(1.06) saturate(1.05);}
  .tm-tile:focus-visible{outline:2px solid var(--ink); outline-offset:-2px;}
  .tm-tile[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink);}
  .tm-tile.other{cursor:default; background:repeating-linear-gradient(45deg, var(--grid), var(--grid) 6px, var(--surface) 6px, var(--surface) 10px) !important; color:var(--ink-2) !important;}
  .tm-name{font-size:12.5px; font-weight:600; line-height:1.2; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .tm-meta{font-size:11.5px; font-variant-numeric:tabular-nums; opacity:.78; white-space:nowrap; font-weight:500;}
  .tm-big .tm-name{font-size:15px;} .tm-big .tm-meta{font-size:13px;}
  .tm-val{font-weight:700; line-height:1.05; letter-spacing:-.02em; font-variant-numeric:tabular-nums; white-space:nowrap; margin:3px 0 2px;}
  .tm-kids{font-size:11.5px; font-weight:500; opacity:.7; margin-top:auto; white-space:nowrap;}
  .tm-tile:hover .tm-kids{opacity:1;}
  .heat-legend{display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; font-size:12px; color:var(--ink-2); margin:10px 0 0;}
  .heat-legend .sw{display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-2px; margin-right:5px;}
  .wbar{display:inline-block; height:8px; border-radius:0 4px 4px 0; background:var(--c-actual); vertical-align:middle; margin-right:8px; opacity:.85;}
  .xtable td.name{max-width:280px;}
  .xtable tr.click{cursor:pointer;} .xtable tr.click:hover td{background:var(--page);}
  .xtable tr.sel td{background:color-mix(in srgb, var(--c-actual) 9%, transparent);}
  .xtable .kid-mark{color:var(--muted); font-size:12px; margin-left:4px;}
  .chip{display:inline-block; min-width:52px; text-align:right; font-weight:600; font-variant-numeric:tabular-nums;}
  .sec-tabs{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 14px;}
  .detail-kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin:6px 0 12px;}
  .detail-kpis .k{background:var(--page); border:1px solid var(--border); border-radius:10px; padding:9px 11px; min-width:0;}
  .detail-kpis .k .l{font-size:12px; color:var(--ink-2);} .detail-kpis .k .v{font-size:19px; font-weight:600; letter-spacing:-.01em; font-variant-numeric:tabular-nums;}
  .movers{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;}
  .kpi .spark{margin-top:8px;}
  .kpi a.kpi-link{text-decoration:none; color:inherit; display:block;}
  .kpi.linky{cursor:pointer;} .kpi.linky:hover{border-color:var(--axis);}
  .two-col-legend{display:flex; gap:16px; flex-wrap:wrap;}
  .note{font-size:12.5px; color:var(--muted); margin:8px 0 0;}
  .grid-6{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px;}

  /* ---------- responsive ---------- */
  @media (max-width: 1100px){
    .grid-4{grid-template-columns:repeat(2,minmax(0,1fr));}
    .detail-kpis{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  @media (max-width: 900px){
    .shell{grid-template-columns:1fr;}
    .side{position:sticky; top:0; z-index:20; height:auto; flex-direction:row; align-items:center; gap:10px; padding:10px 12px; border-right:0; border-bottom:1px solid var(--border); overflow-x:auto; scrollbar-width:none;}
    .side::-webkit-scrollbar{display:none;}
    .brand .brand-text{display:none;}
    .brand{padding:0 4px;}
    .nav-group{flex-direction:row; gap:4px;}
    .nav-label, .side-foot{display:none;}
    .nav-link{padding:6px 10px; font-size:13.5px;}
    .nav-link svg{display:none;}
    .content{padding:26px 18px 48px;}
    .grid-2, .grid-3{grid-template-columns:minmax(0,1fr);}
    .grid-6{grid-template-columns:repeat(2,minmax(0,1fr));}
    .movers{grid-template-columns:minmax(0,1fr);}
  }
  @media (max-width: 560px){
    .grid-4{grid-template-columns:1fr 1fr;}
    .kpi{padding:14px;}
    .kpi-value{font-size:22px;} .kpi.hero .kpi-value{font-size:30px;}
    .card{padding:16px;}
    .calc-inputs{grid-template-columns:1fr 1fr;}
    .calc-inputs .field:first-child{grid-column:1 / -1;}
    .hb-row{grid-template-columns:104px 1fr 56px;}
    .hb-row.wide{grid-template-columns:120px 1fr 52px;}
    .hb-row.wide .hb-rmse, .hb-row .tag{display:none;}
    .grid-6{grid-template-columns:minmax(0,1fr);}
    .hb-row[style]{grid-template-columns:112px 1fr 58px !important;}
    .xtable .hide-sm{display:none;}
    .tm-name{font-size:11.5px;}
  }

  /* =====================================================================
     SHOWCASE SKIN: glass top bar, cinematic hero, ticker, explore cards
     ===================================================================== */
  :root{
    --grad:linear-gradient(92deg,#4f8ff7 0%,#9b7bff 48%,#ff8f57 100%);
    --glow:#9b7bff;
    --glass:color-mix(in srgb, var(--page) 72%, transparent);
    --ease:cubic-bezier(.2,.7,.2,1);
    --ctop:40px;
  }
  :root[data-theme="dark"]{
    --page:#07070a; --surface:#111116; --side:#0b0b0f;
    --grid:#24242b; --border:rgba(255,255,255,.08);
  }
  :root[data-theme="light"]{ --grad:linear-gradient(92deg,#1f63c9 0%,#6b4fe0 48%,#e0602c 100%); --glow:#6b4fe0; }
  html{scroll-behavior:smooth;}
  body{overflow-x:clip;
    background:
      radial-gradient(1100px 620px at 88% -12%, color-mix(in srgb, var(--glow) 13%, transparent), transparent 62%),
      radial-gradient(900px 520px at -12% 8%, color-mix(in srgb, var(--c-actual) 10%, transparent), transparent 60%),
      var(--page);
    background-attachment:fixed;}
  ::selection{background:color-mix(in srgb, var(--glow) 40%, transparent);}

  /* top bar replaces the sidebar on every screen size */
  .shell{display:block;}
  .side{position:sticky; top:0; z-index:40; height:auto; overflow:visible; flex-direction:row; align-items:center; gap:18px;
    padding:11px clamp(16px,3vw,40px); border-right:0; border-bottom:1px solid var(--border);
    background:var(--glass); -webkit-backdrop-filter:saturate(1.5) blur(16px); backdrop-filter:saturate(1.5) blur(16px);}
  .brand{padding:0; font-size:15px;}
  .brand-mark{background:var(--grad); width:28px; height:28px; border-radius:9px; box-shadow:0 6px 18px -6px var(--glow);}
  .nav-group{flex-direction:row; gap:2px; margin-left:auto; min-width:0; overflow-x:auto; scrollbar-width:none;}
  .nav-group::-webkit-scrollbar{display:none;}
  .nav-link{padding:6px 13px; font-size:13.5px; border-radius:999px; font-weight:500;}
  .nav-link svg{display:none;}
  .nav-link:hover{background:color-mix(in srgb, var(--ink) 7%, transparent);}
  .nav-link[aria-current="page"]{background:color-mix(in srgb, var(--ink) 10%, transparent); box-shadow:none;}
  .side-foot{margin-top:0; padding:0; display:flex; flex-direction:row; align-items:center; gap:6px;}
  .side-foot .status{display:none;}
  .side-foot a, .icon-btn{width:34px; height:34px; display:inline-grid; place-items:center; border-radius:999px; border:1px solid var(--border);
    background:none; color:var(--ink-2); cursor:pointer; font-size:0; padding:0; transition:color .2s, border-color .2s, background .2s;}
  .side-foot a:hover, .icon-btn:hover{color:var(--ink); border-color:color-mix(in srgb, var(--ink) 25%, transparent);}
  .icon-btn .sun{display:none;} :root[data-theme="dark"] .icon-btn .sun{display:block;} :root[data-theme="dark"] .icon-btn .moon{display:none;}
  .content{max-width:1480px; margin:0 auto; padding-top:var(--ctop);}

  /* headings & surfaces */
  .page-title{font-size:clamp(28px,3.4vw,40px); letter-spacing:-.028em; font-weight:650; line-height:1.12;}
  .card, .kpi{background:linear-gradient(180deg, color-mix(in srgb, var(--ink) 3%, transparent), transparent 45%), var(--surface);}
  .kpi.linky{transition:transform .25s var(--ease), border-color .25s;}
  .kpi.linky:hover{transform:translateY(-3px); border-color:color-mix(in srgb, var(--glow) 45%, var(--border));}
  .subtabs{border-radius:999px; padding:4px;} .subtabs a{border-radius:999px; padding:6px 14px;}
  .seg button[aria-pressed="true"]{background:var(--ink); color:var(--page);}

  /* ---------- hero ---------- */
  .ov-hero{position:relative; isolation:isolate; overflow:hidden; width:100vw; margin:calc(-1 * var(--ctop)) 0 0 calc(50% - 50vw);
    min-height:min(90vh, 860px); display:grid; place-items:center; padding:88px 20px 72px; text-align:center;}
  .wall{position:absolute; inset:-35% -25%; z-index:-2; display:flex; flex-direction:column; justify-content:center; gap:14px;
    transform:perspective(1300px) rotateX(50deg) rotateZ(-16deg); transform-origin:50% 45%; pointer-events:none;}
  .wall-row{display:flex; gap:14px; padding-right:14px; width:max-content; animation:drift var(--dur,90s) linear infinite; will-change:transform;}
  .wall-row:nth-child(even){animation-direction:reverse;}
  .wtile{flex:none; width:172px; height:72px; border-radius:12px; padding:10px 12px; display:flex; flex-direction:column; justify-content:space-between; text-align:left;
    background:linear-gradient(150deg, color-mix(in srgb, var(--tc) 62%, transparent), color-mix(in srgb, var(--tc) 22%, transparent));
    border:1px solid color-mix(in srgb, var(--tc) 55%, rgba(255,255,255,.12)); color:var(--tt); font-size:11.5px; line-height:1.25;
    box-shadow:0 14px 30px -12px rgba(0,0,0,.55);}
  :root[data-theme="dark"] .wtile{color:#fff;}
  .wtile span{opacity:.82; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .wtile b{font-size:19px; font-weight:650; letter-spacing:-.02em; font-variant-numeric:tabular-nums;}
  .ov-hero::before{content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(ellipse 58% 52% at 50% 50%, color-mix(in srgb, var(--page) 94%, transparent) 0%, color-mix(in srgb, var(--page) 70%, transparent) 50%, transparent 82%),
      linear-gradient(to bottom, color-mix(in srgb, var(--page) 55%, transparent) 0%, transparent 22%, transparent 68%, var(--page) 100%);}
  @keyframes drift{to{transform:translateX(-50%);}}
  .hero-inner{display:flex; flex-direction:column; align-items:center; max-width:1000px; width:100%; position:relative;}
  .hero-inner::before{content:""; position:absolute; z-index:-1; left:50%; top:46%; width:min(920px,100%); height:70%; translate:-50% -50%; pointer-events:none;
    background:radial-gradient(ellipse at center, color-mix(in srgb, var(--page) 78%, transparent) 0%, color-mix(in srgb, var(--page) 55%, transparent) 45%, transparent 72%); filter:blur(8px);}
  .live-pill{display:inline-flex; align-items:center; gap:9px; padding:6px 14px; border-radius:999px; border:1px solid var(--border);
    background:var(--glass); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); font-size:13px; color:var(--ink-2); font-weight:500;}
  .live-pill .dot{width:8px; height:8px; border-radius:50%; background:var(--c-good); color:var(--c-good); animation:pulse 2.2s ease-out infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb, currentColor 60%, transparent);} 100%{box-shadow:0 0 0 10px transparent;}}
  .hero-title{font-size:clamp(40px, 10vw, 136px); line-height:.92; letter-spacing:-.048em; font-weight:700; margin:24px 0 20px; max-width:none;}
  .hero-title .l2{display:block; padding-bottom:.06em; background:var(--grad); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:sheen 9s ease-in-out infinite alternate;}
  @keyframes sheen{to{background-position:100% 0;}}
  .hero-sub{font-size:clamp(16px,1.6vw,19px); line-height:1.55; color:var(--ink-2); max-width:640px; margin:0 0 32px; text-wrap:balance;}
  .cta{display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}
  .btn{display:inline-flex; align-items:center; gap:8px; padding:12px 20px; border-radius:12px; font:inherit; font-size:14.5px; font-weight:600; text-decoration:none;
    border:1px solid var(--border); background:var(--glass); color:var(--ink); cursor:pointer; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    transition:transform .25s var(--ease), border-color .25s, box-shadow .25s;}
  .btn:hover{transform:translateY(-2px); border-color:color-mix(in srgb, var(--ink) 28%, transparent);}
  .btn.primary{background:var(--grad); color:#fff; border-color:transparent; box-shadow:0 12px 32px -12px var(--glow);}
  .btn.primary:hover{box-shadow:0 16px 40px -10px var(--glow);}
  .btn .arr{transition:transform .25s var(--ease);} .btn:hover .arr{transform:translateX(3px);}
  .btn:focus-visible, .xcard:focus-visible{outline:2px solid var(--glow); outline-offset:3px;}
  .hero-stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1px; width:100%; max-width:880px; margin-top:48px;
    background:var(--border); border:1px solid var(--border); border-radius:18px; overflow:hidden; -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);}
  .hs{background:var(--glass); padding:16px 18px 15px; text-align:left; text-decoration:none; color:inherit; transition:background .2s;}
  .hs:hover{background:color-mix(in srgb, var(--surface) 85%, transparent);}
  .hs .l{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; font-weight:600;}
  .hs .v{font-size:clamp(24px,2.7vw,34px); font-weight:650; letter-spacing:-.025em; margin-top:2px; font-variant-numeric:tabular-nums; line-height:1.2;}
  .hs .s{font-size:12.5px; color:var(--ink-2);}
  .scroll-cue{position:absolute; left:50%; bottom:20px; translate:-50% 0; width:22px; height:34px; border-radius:12px; border:1.5px solid var(--axis);}
  .scroll-cue::after{content:""; position:absolute; left:50%; top:7px; width:3px; height:7px; margin-left:-1.5px; border-radius:2px; background:var(--ink-2); animation:cue 1.8s ease-in-out infinite;}
  @keyframes cue{0%{opacity:0; transform:translateY(-3px);} 40%{opacity:1;} 100%{opacity:0; transform:translateY(9px);}}

  /* ---------- ticker ---------- */
  .ticker{width:100vw; margin:0 0 8px calc(50% - 50vw); border-block:1px solid var(--border); padding:15px 0; overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);}
  .ticker-track{display:flex; gap:44px; padding-right:44px; width:max-content; animation:drift 70s linear infinite;}
  .ticker:hover .ticker-track{animation-play-state:paused;}
  .tk{display:inline-flex; align-items:baseline; gap:9px; font-size:14px; color:var(--ink-2); white-space:nowrap;}
  .tk b{font-weight:600; font-variant-numeric:tabular-nums;} .tk .up{color:var(--c-bad);} .tk .dn{color:var(--c-good);} .tk .nt{color:var(--ink);}
  .tk::after{content:""; width:4px; height:4px; border-radius:50%; background:var(--axis); margin-left:35px; align-self:center;}
  .tk-h{font-size:11.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .tk-h::after{display:none;}
  .tk i{font-style:normal; font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .ticker.page-tk{margin:4px 0 22px calc(50% - 50vw); padding:12px 0;}
  .ticker.slow .ticker-track{animation-duration:95s;}
  .wall-band{position:relative; width:100vw; margin:44px 0 -8px calc(50% - 50vw); display:flex; flex-direction:column; gap:10px; overflow:hidden; pointer-events:none; opacity:.42;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); mask-image:linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent);}
  .wall-band .wall-row{--dur:160s;} .wall-band .wall-row:nth-child(2){--dur:210s;} .wall-band .wall-row:nth-child(3){--dur:185s;}
  .wall-band .wtile{width:150px; height:58px; font-size:10.5px; box-shadow:none;} .wall-band .wtile b{font-size:16px;}
  @media (max-width: 600px){ .wall-band{opacity:.3;} }
  .wall-label{margin:44px 0 -30px; text-align:center; font-size:13px; color:var(--muted, inherit); opacity:.8;}

  /* ---------- overview sections ---------- */
  .sec-head{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin:64px 0 18px;}
  .kicker{display:inline-block; font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .sec-title{font-size:clamp(26px,3.2vw,40px); font-weight:650; letter-spacing:-.03em; line-height:1.1; margin:8px 0 0; max-width:none;}
  .sec-lede{color:var(--ink-2); font-size:15px; margin:8px 0 0; max-width:620px;}
  .explore{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px;}
  .xcard{position:relative; display:flex; flex-direction:column; gap:8px; min-height:208px; padding:22px; border-radius:20px; text-decoration:none; color:inherit; overflow:hidden;
    background:linear-gradient(180deg, color-mix(in srgb, var(--ink) 3%, transparent), transparent 50%), var(--surface); border:1px solid var(--border);
    transition:transform .3s var(--ease), border-color .3s;}
  .xcard::before{content:""; position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .3s;
    background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%), color-mix(in srgb, var(--ic) 20%, transparent), transparent 55%);}
  .xcard:hover{transform:translateY(-4px); border-color:color-mix(in srgb, var(--ic) 45%, var(--border));}
  .xcard:hover::before{opacity:1;}
  .xcard .ico{width:42px; height:42px; border-radius:13px; display:grid; place-items:center; color:var(--ic);
    background:color-mix(in srgb, var(--ic) 15%, transparent); border:1px solid color-mix(in srgb, var(--ic) 30%, transparent);}
  .xcard h3{margin:8px 0 0; font-size:17.5px; font-weight:600; letter-spacing:-.012em; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .xcard h3 .arr{color:var(--muted); transition:transform .3s var(--ease), color .3s;} .xcard:hover h3 .arr{transform:translateX(4px); color:var(--ic);}

      <a class="nav-link" href="#findings"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1.8a4.2 4.2 0 0 0-2.6 7.5c.5.4.8 1 .8 1.6v.6h3.6v-.6c0-.6.3-1.2.8-1.6A4.2 4.2 0 0 0 8 1.8z" stroke-linejoin="round"/><path d="M6.3 13.5h3.4" stroke-linecap="round"/></svg>The story</a>

      <span class="status" id="sideStatus"><span class="row"><span class="dot"></span>Loading…</span></span>

        <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>

    </div>

  <main class="content" id="app"><div class="loading">Loading the latest economic data…</div></main>
</div>

<script>
(function(){
  "use strict";

  // light / dark toggle (dark is the default; the choice is remembered per browser)
  const themeBtn = document.getElementById('themeBtn');
  if(themeBtn) themeBtn.addEventListener('click', ()=>{
    const next = document.documentElement.getAttribute('data-theme')==='light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('theme', next); }catch(e){}
  });

  // The model used by src/arima_forecast.py. Keep in sync if the order changes.
  const MODEL_NAME = "ARIMA(1, 0, 2)";
  const FED_TARGET = 2.0;

  // ================= helpers =================
  function splitCSVLine(line){
    const out=[]; let cur=''; let q=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){ q=!q; }
      else if(c===',' && !q){ out.push(cur); cur=''; }
      else { cur+=c; }
    }
    out.push(cur);
    return out;
  }
  function parseCSV(text){
    const lines = text.replace(/\r/g,'').split('\n').filter(l=>l.length>0);
    if(!lines.length) return [];
    const headers = splitCSVLine(lines[0]);
    return lines.slice(1).map(line=>{
      const cells = splitCSVLine(line); const o={};
      headers.forEach((h,i)=>{ o[h]=cells[i]; });
      return o;
    });
  }
  const num = v => (v===undefined || v==='' || v===null) ? null : (isNaN(parseFloat(v)) ? null : parseFloat(v));
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const MONTHS_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const parseDate = s => { const p=s.split('-').map(x=>parseInt(x,10)); return new Date(Date.UTC(p[0], p[1]-1, p[2]||1)); };
  const fmtMonth = d => MONTHS[d.getUTCMonth()] + " " + d.getUTCFullYear();
  const fmtMonthLong = d => MONTHS_LONG[d.getUTCMonth()] + " " + d.getUTCFullYear();
  const isoDate = d => d.toISOString().slice(0,10);
  const fix0 = (v, d) => { const s = v.toFixed(d); return /^-0\.?0*$/.test(s) ? s.slice(1) : s; };
  const pct = (v, d=1) => (v==null || !isFinite(v)) ? "—" : fix0(v, d) + "%";
  const sgn = (v, d) => +Math.abs(v).toFixed(d)===0 ? "" : v>0 ? "+" : "−";
  const spct = (v, d=1) => (v==null || !isFinite(v)) ? "—" : sgn(v,d) + Math.abs(v).toFixed(d) + "%";
  const pp = (v, d=1) => (v==null || !isFinite(v)) ? "—" : sgn(v,d) + Math.abs(v).toFixed(d) + " points";
  const usd = (v, d=2) => (v==null || !isFinite(v)) ? "—" : "$" + v.toLocaleString("en-US",{minimumFractionDigits:d, maximumFractionDigits:d});
  const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const addMonths = (d, n) => new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+n, 1));
  const monthDiff = (a, b) => (b.getUTCFullYear()-a.getUTCFullYear())*12 + (b.getUTCMonth()-a.getUTCMonth());
  const cleanModel = s => String(s).replace(/\s+/g,' ').trim();
  const lastIdx = arr => { for(let i=arr.length-1;i>=0;i--) if(arr[i]!=null && isFinite(arr[i])) return i; return -1; };

  async function loadCSV(path, optional){
    try{
      const res = await fetch(path, {cache:"no-store"});
      if(!res.ok) throw new Error(`Failed to load ${path} (HTTP ${res.status})`);
      return parseCSV(await res.text());
    }catch(e){ if(optional) return []; throw e; }
  }

  // Linearly fill gaps that sit between two known values (e.g. BLS skipped Oct 2025).
  function fillInterior(arr){
    const out = arr.slice();
    let prev = -1;
    for(let i=0;i<out.length;i++){
      if(out[i]==null) continue;
      if(prev>=0 && i-prev>1){ for(let k=prev+1;k<i;k++) out[k] = out[prev] + (out[i]-out[prev])*(k-prev)/(i-prev); }
      prev = i;
    }
    return out;
  }
  const yoyOf = arr => arr.map((v,i)=> (i>=12 && v!=null && arr[i-12]!=null) ? (v/arr[i-12]-1)*100 : null);

  function niceTicks(min, max, count){
    const span = (max - min) || 1;
    const raw = span / count;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map(m=>m*mag).find(s=>s>=raw);
    const start = Math.floor(min/step)*step;
    const out=[];
    for(let i=0; start+i*step < max+step-1e-9; i++) out.push(+(start+i*step).toFixed(10));
    return out;
  }
  const tickDecimals = t => { const s = t.length>1 ? Math.abs(t[1]-t[0]) : 1; return s>=1 ? 0 : s>=0.1 ? 1 : 2; };

  // ================= chart engine (responsive inline SVG) =================
  const SVGNS = "http://www.w3.org/2000/svg";
  const charts = [];
  function mount(el, draw){ if(!el) return; el.__draw = draw; charts.push(el); if(el.offsetParent!==null) draw(el); }
  function redrawVisible(){ charts.forEach(el=>{ if(document.body.contains(el) && el.offsetParent!==null) el.__draw(el); }); }
  let rT=null, lastW=window.innerWidth;
  window.addEventListener('resize', ()=>{ if(window.innerWidth===lastW) return; lastW=window.innerWidth; clearTimeout(rT); rT=setTimeout(redrawVisible,120); });

  function monthTicks(t0, t1, width){
    const months = monthDiff(t0, t1);
    const maxTicks = Math.max(2, Math.floor(width/88));
    const steps = [1,2,3,6,12,24,60,120,240];
    const step = steps.find(s=>months/s <= maxTicks) || 240;
    let d;
    if(step<12) d = new Date(Date.UTC(t0.getUTCFullYear(), Math.ceil(t0.getUTCMonth()/step)*step, 1));
    else { const y=step/12; d = new Date(Date.UTC(Math.ceil(t0.getUTCFullYear()/y)*y, 0, 1)); }
    const ticks=[];
    while(d<=t1){ if(d>=t0) ticks.push(d); d = addMonths(d, step); }
    const fmt = step>=12 ? (x=>String(x.getUTCFullYear())) : (x=>MONTHS[x.getUTCMonth()]+" '"+String(x.getUTCFullYear()).slice(2));
    return {ticks, fmt};
  }
  const COLOR_VAR = {actual:'--c-actual', model:'--c-model', c3:'--c-3', c4:'--c-4', ref:'--c-ref', c5:'--c-5', c6:'--c-6', c7:'--c-7', c8:'--c-8'};

  /*
    lineChart(cfg) -> draw(el)
      dates: Date[] shared by every series
      series: [{label, cls, values, dashed?, endMarker?, skipTipAt?(i)}]
      band: {lower, upper, label}   refs: [{value, label}]   events: [{i, label, below?}]
      height, zeroLine, area (fill under first series), compact (sparkline: no axes)
      yFmt(v, decimals), tipFmt(v)
  */
  function lineChart(cfg){
    return function draw(el){
      const W = Math.max(200, el.clientWidth || 600);
      const H = typeof cfg.height === 'function' ? cfg.height(W) : (cfg.height || 320);
      const compact = !!cfg.compact;
      const narrow = W < 520;
      const rightLabel = cfg.series.some(s=>s.endLabel==='right');
      const m = compact ? {t:4, r:4, b:4, l:4} : {t:14, r: rightLabel ? 52 : 14, b:28, l:46};
      const pw = W-m.l-m.r, ph = H-m.t-m.b;
      const dates = cfg.dates, N = dates.length;
      if(!N){ el.innerHTML = '<div class="empty">No data yet.</div>'; return; }
      const t0 = dates[0], t1 = dates[N-1];
      const X = i => m.l + (N>1 ? (dates[i]-t0)/(t1-t0)*pw : pw/2);

      const vals=[];
      cfg.series.forEach(s=>s.values.forEach(v=>{ if(v!=null && isFinite(v)) vals.push(v); }));
      if(cfg.band) cfg.band.lower.concat(cfg.band.upper).forEach(v=>{ if(v!=null && isFinite(v)) vals.push(v); });
      (cfg.refs||[]).forEach(r=>vals.push(r.value));
      if(cfg.zeroLine) vals.push(0);
      if(!vals.length){ el.innerHTML = '<div class="empty">No data yet.</div>'; return; }
      let lo=Math.min(...vals), hi=Math.max(...vals);
      if(lo===hi){ lo-=1; hi+=1; }
      let y0, y1, yt=[];
      if(compact){ const pad=(hi-lo)*0.08; y0=lo-pad; y1=hi+pad; }
      else { yt = niceTicks(lo, hi, narrow?4:5); y0=yt[0]; y1=yt[yt.length-1]; }
      const Y = v => m.t + ph - (v-y0)/(y1-y0)*ph;
      const dec = tickDecimals(yt);
      const yFmt = cfg.yFmt || ((v,d)=>v.toFixed(d));

      let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(cfg.aria||'Chart')}">`;
      if(!compact){
        s += `<g class="grid">` + yt.map(t=>`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/>`).join('') + `</g>`;
        s += yt.map(t=>`<text x="${m.l-8}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end">${esc(yFmt(t, dec))}</text>`).join('');
        if(cfg.zeroLine && y0<0 && y1>0) s += `<line class="baseline" x1="${m.l}" x2="${W-m.r}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}"/>`;
        const mt = monthTicks(t0, t1, pw);
        const xOf = d => m.l + (N>1 ? (d-t0)/(t1-t0)*pw : pw/2);
        s += mt.ticks.map(d=>`<text x="${xOf(d).toFixed(1)}" y="${H-8}" text-anchor="middle">${mt.fmt(d)}</text>`).join('');
      }
      if(cfg.band){
        const idx=[]; for(let i=0;i<N;i++){ if(cfg.band.lower[i]!=null && cfg.band.upper[i]!=null) idx.push(i); }
        if(idx.length){
          let d = idx.map((i,k)=>(k?'L':'M')+X(i).toFixed(1)+' '+Y(cfg.band.upper[i]).toFixed(1)).join(' ');
          d += ' ' + idx.slice().reverse().map(i=>'L'+X(i).toFixed(1)+' '+Y(cfg.band.lower[i]).toFixed(1)).join(' ') + ' Z';
          s += `<path class="band-model" d="${d}"/>`;
        }
      }
      (cfg.refs||[]).forEach(r=>{
        const y=Y(r.value).toFixed(1);
        s += `<line class="ref" x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}"/>`;
        if(r.label && !compact) s += `<text class="ref-label" x="${m.l+6}" y="${(Y(r.value)-6).toFixed(1)}">${esc(r.label)}</text>`;
      });
      function pathOf(values){
        let d='', on=false;
        for(let i=0;i<N;i++){
          const v=values[i];
          if(v==null || !isFinite(v)){ on=false; continue; }
          d += (on?' L':' M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); on=true;
        }
        return d;
      }
      if(cfg.area){
        const v=cfg.series[0].values; const f=v.findIndex(x=>x!=null), l=lastIdx(v);
        if(f>=0) s += `<path class="area-actual" d="${pathOf(v)} L${X(l).toFixed(1)} ${(m.t+ph).toFixed(1)} L${X(f).toFixed(1)} ${(m.t+ph).toFixed(1)} Z"/>`;
      }
      cfg.series.forEach(se=>{ s += `<path class="s s-${se.cls}${se.dashed?' dashed':''}" d="${pathOf(se.values)}"/>`; });
      cfg.series.forEach(se=>{
        if(!se.endMarker) return;
        const i = lastIdx(se.values); if(i<0) return;
        s += `<circle class="dot-${se.cls} ring" cx="${X(i).toFixed(1)}" cy="${Y(se.values[i]).toFixed(1)}" r="${compact?3.5:4.5}"/>`;
      });
      cfg.series.forEach(se=>{
        if(!se.endLabel || compact) return;
        const i = lastIdx(se.values); if(i<0) return;
        const x = X(i), y = Y(se.values[i]), t = esc((cfg.endFmt||cfg.tipFmt||(v=>v.toFixed(1)))(se.values[i]));
        if(se.endLabel==='right') s += `<text class="end-label" x="${(x+9).toFixed(1)}" y="${(y+4).toFixed(1)}">${t}</text>`;
        else {
          // put the label on the side away from the recent line, so it never sits on the curve
          const back = se.values.slice(Math.max(0,i-4), i).filter(v=>v!=null);
          const below = back.length && Math.max(...back) > se.values[i];
          s += `<text class="end-label" x="${(x-8).toFixed(1)}" y="${(below ? y+20 : y-11).toFixed(1)}" text-anchor="end">${t}</text>`;
        }
      });
      // event annotations (history)
      (cfg.events||[]).forEach(ev=>{
        const v = cfg.series[0].values[ev.i]; if(v==null) return;
        const x=X(ev.i), y=Y(v);
        if(!narrow){
          const ly = ev.below ? y+26 : y-22;
          const anchor = x < m.l+60 ? 'start' : x > W-m.r-60 ? 'end' : 'middle';
          s += `<line class="ev-line" x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${(ev.below? y+6 : y-6).toFixed(1)}" y2="${(ev.below? ly-12 : ly+4).toFixed(1)}"/>`;
          s += `<text class="ev-label" x="${x.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}">${esc(ev.label)}</text>`;
        }
        s += `<circle class="ev-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"/>`;
      });
      s += `<line class="xhair" x1="0" x2="0" y1="${m.t}" y2="${m.t+ph}" visibility="hidden"/><g class="hover-dots"></g>`;
      s += `<rect class="hit" x="${m.l}" y="0" width="${pw}" height="${H}" fill="transparent"/></svg>`;
      el.innerHTML = s;

      const tip = document.createElement('div'); tip.className='tip'; el.appendChild(tip);
      const svg = el.querySelector('svg'), xhair = svg.querySelector('.xhair'), hdots = svg.querySelector('.hover-dots'), hit = svg.querySelector('.hit');
      const tipFmt = cfg.tipFmt || (v=>v.toFixed(2));
      const evAt = new Map((cfg.events||[]).map(e=>[e.i, e.label]));
      function row(key, color, value){
        const r=document.createElement('div'); r.className='t-row';
        const k=document.createElement('span'); k.className='t-key';
        if(color){ const sw=document.createElement('span'); sw.className='key-line'; sw.style.background=`var(${color})`; k.appendChild(sw); }
        k.appendChild(document.createTextNode(key));
        const b=document.createElement('b'); b.textContent=value;
        r.appendChild(k); r.appendChild(b); tip.appendChild(r);
      }
      function show(evt){
        const r = svg.getBoundingClientRect();
        const px = (evt.clientX - r.left) * (W / r.width);
        let best=0, bd=Infinity;
        for(let i=0;i<N;i++){ const dd=Math.abs(X(i)-px); if(dd<bd){ bd=dd; best=i; } }
        const x = X(best);
        tip.textContent=''; hdots.innerHTML='';
        const dt=document.createElement('div'); dt.className='t-date'; dt.textContent=(cfg.dateFmt||fmtMonthLong)(dates[best]); tip.appendChild(dt);
        let any=false;
        cfg.series.forEach(se=>{
          const v=se.values[best]; if(v==null || !isFinite(v)) return;
          if(se.skipTipAt && se.skipTipAt(best)) return;
          any=true;
          const c=document.createElementNS(SVGNS,'circle');
          c.setAttribute('cx',x); c.setAttribute('cy',Y(v)); c.setAttribute('r',compact?3.5:4.5); c.setAttribute('class','ring dot-'+se.cls);
          hdots.appendChild(c);
          row(se.label, COLOR_VAR[se.cls], tipFmt(v));
        });
        if(cfg.band && cfg.band.lower[best]!=null && !(cfg.band.skipTipAt && cfg.band.skipTipAt(best))){ row(cfg.band.label, null, tipFmt(cfg.band.lower[best])+' – '+tipFmt(cfg.band.upper[best])); any=true; }
        if(evAt.has(best)){ const n=document.createElement('div'); n.className='t-note'; n.textContent=evAt.get(best); tip.appendChild(n); }
        if(!any){ hide(); return; }
        xhair.setAttribute('x1', x); xhair.setAttribute('x2', x); xhair.setAttribute('visibility','visible');
        tip.style.opacity=1;
        const sc = r.width / W, tw = tip.offsetWidth;
        let left = x*sc + 14; if(left + tw > r.width) left = x*sc - tw - 14;
        tip.style.left = Math.max(0,left)+'px';
        tip.style.top = compact ? (H*sc+6)+'px' : (m.t*sc + 4)+'px';
      }
      function hide(){ xhair.setAttribute('visibility','hidden'); hdots.innerHTML=''; tip.style.opacity=0; }
      hit.addEventListener('pointermove', show);
      hit.addEventListener('pointerdown', show);
      hit.addEventListener('pointerleave', hide);
    };
  }

  function columnChart(cfg){
    return function draw(el){
      const W = Math.max(200, el.clientWidth || 600), H = cfg.height || 240;
      const m = {t:12, r:12, b:28, l:46};
      const pw=W-m.l-m.r, ph=H-m.t-m.b;
      const N=cfg.values.length;
      const lo=Math.min(0,...cfg.values), hi=Math.max(0,...cfg.values);
      const yt=niceTicks(lo,hi,4), y0=yt[0], y1=yt[yt.length-1];
      const Y=v=>m.t+ph-(v-y0)/(y1-y0)*ph;
      const band=pw/N, bw=Math.min(24, band*0.62), dec=tickDecimals(yt);
      let s=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(cfg.aria||'Chart')}"><g class="grid">`;
      s+=yt.map(t=>`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/>`).join('')+`</g>`;
      s+=yt.map(t=>`<text x="${m.l-8}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end">${cfg.yFmt(t,dec)}</text>`).join('');
      const mt = monthTicks(cfg.dates[0], cfg.dates[N-1], pw);
      mt.ticks.forEach(d=>{ const i=cfg.dates.findIndex(x=>x.getTime()===d.getTime()); if(i>=0) s+=`<text x="${(m.l+band*i+band/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${mt.fmt(d)}</text>`; });
      const r=Math.min(4, bw/2);
      for(let i=0;i<N;i++){
        const v=cfg.values[i], x=m.l+band*i+band/2-bw/2, yb=Y(0), yv=Y(v), h=Math.abs(yb-yv), rr=Math.min(r,h);
        let d;
        if(h<0.5) d=`M${x} ${yb} h${bw}`;
        else if(v>=0) d=`M${x} ${yb} V${yv+rr} Q${x} ${yv} ${x+rr} ${yv} H${x+bw-rr} Q${x+bw} ${yv} ${x+bw} ${yv+rr} V${yb} Z`;
        else d=`M${x} ${yb} V${yv-rr} Q${x} ${yv} ${x+rr} ${yv} H${x+bw-rr} Q${x+bw} ${yv} ${x+bw} ${yv-rr} V${yb} Z`;
        s+=`<path class="bar-actual" data-i="${i}" d="${d}"/><rect class="bar-hit" data-i="${i}" x="${(m.l+band*i).toFixed(1)}" y="${m.t}" width="${band.toFixed(1)}" height="${ph}" fill="transparent"/>`;
      }
      s+=`<line class="baseline" x1="${m.l}" x2="${W-m.r}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}"/></svg>`;
      el.innerHTML=s;
      const tip=document.createElement('div'); tip.className='tip'; el.appendChild(tip);
      const svg=el.querySelector('svg');
      svg.querySelectorAll('.bar-hit').forEach(h=>{
        const i=+h.dataset.i, bar=svg.querySelector(`.bar-actual[data-i="${i}"]`);
        const on=()=>{
          bar.classList.add('hover'); tip.textContent='';
          const dt=document.createElement('div'); dt.className='t-date'; dt.textContent=fmtMonthLong(cfg.dates[i]); tip.appendChild(dt);
          const row=document.createElement('div'); row.className='t-row';
          const k=document.createElement('span'); k.className='t-key'; k.textContent=cfg.label;
          const b=document.createElement('b'); b.textContent=cfg.tipFmt(cfg.values[i]);
          row.appendChild(k); row.appendChild(b); tip.appendChild(row);
          if(cfg.notes && cfg.notes[i]){ const n=document.createElement('div'); n.className='t-note'; n.textContent=cfg.notes[i]; tip.appendChild(n); }
          const rc=svg.getBoundingClientRect(), sc=rc.width/W; tip.style.opacity=1;
          let left=(m.l+band*i+band)*sc+6; if(left+tip.offsetWidth>rc.width) left=(m.l+band*i)*sc-tip.offsetWidth-6;
          tip.style.left=Math.max(0,left)+'px'; tip.style.top=(m.t*sc)+'px';
        };
        const off=()=>{ bar.classList.remove('hover'); tip.style.opacity=0; };
        h.addEventListener('pointerenter', on); h.addEventListener('pointerdown', on); h.addEventListener('pointerleave', off);
      });
    };
  }

  // HTML horizontal bars with a zero line (handles negatives)
  function hbars(rows, opts){
    const vals = rows.map(r=>r.value);
    const lo = Math.min(0, ...vals), hi = Math.max(0, ...vals), span = (hi-lo)||1;
    const zero = (0-lo)/span*100;
    return `<div class="hbars">` + rows.map(r=>{
      const w = Math.abs(r.value)/span*100, left = r.value>=0 ? zero : zero-w;
      return `<div class="hb-row ${r.em?'em':''}"${opts.nameW?` style="grid-template-columns:${opts.nameW} 1fr 64px"`:''}>
        <span class="hb-name">${esc(r.label)}</span>
        <span class="hb-track"><span class="hb-bar ${r.value>=0?'pos':'neg'} c-${r.color||'actual'}" style="left:${left.toFixed(2)}%;width:${Math.max(w,0.6).toFixed(2)}%"></span>${lo<0?`<span class="hb-zero" style="left:${zero.toFixed(2)}%"></span>`:''}</span>
        <span class="hb-v">${esc(opts.fmt(r.value))}</span></div>`;
    }).join('') + `</div>`;
  }

  function segControl(id, options, active){
    return `<div class="seg" role="group" id="${id}">` + options.map(o=>`<button data-v="${o.v}" aria-pressed="${o.v===active}">${o.label}</button>`).join('') + `</div>`;
  }
  function bindSeg(id, onChange){
    const btns = document.querySelectorAll(`#${id} button`);
    btns.forEach(b=>b.addEventListener('click', ()=>{ btns.forEach(x=>x.setAttribute('aria-pressed', x===b?'true':'false')); onChange(b.dataset.v); }));
  }
  const pageFoot = () => `<div class="page-foot"><span>Built by <a href="https://www.linkedin.com/in/pay-chern-liu-8033b033a" target="_blank" rel="noopener">Pay-Chern Liu</a></span><span>Personal research project · statistical estimates, not investment or policy advice · not affiliated with BLS, BEA, FRED or the Federal Reserve.</span><span>Data: <a href="https://www.bls.gov/cpi/" target="_blank" rel="noopener">BLS</a>, <a href="https://www.bea.gov/data/personal-consumption-expenditures-price-index" target="_blank" rel="noopener">BEA</a>, Federal Reserve &amp; U.S. Treasury via <a href="https://fred.stlouisfed.org/" target="_blank" rel="noopener">FRED</a></span></div>`;
  const pending = what => `<div class="empty">${esc(what)} will appear after the next automatic data update.</div>`;

  // chart height grows with width on large screens so wide charts don't look flat
  const H = (desk, mob) => W => W < 520 ? mob : Math.round(Math.min(desk*1.35, Math.max(desk, W*0.28)));
  const padN = n => Array(n).fill(null);

  // ================= wide monthly tables =================
  // CSV rows with a date column -> one value array per column on a complete monthly calendar.
  // Months missing from the file (BLS skipped October 2025) are linearly interpolated,
  // except in columns listed in noFill (the 30-year bond was not issued 2002-2006).
  function wideTable(rows, noFill){
    if(!rows || !rows.length) return null;
    const recs = rows.map(r=>({date:parseDate(r.date), r})).sort((a,b)=>a.date-b.date);
    const t0 = recs[0].date, n = monthDiff(t0, recs[recs.length-1].date) + 1;
    const dates = Array.from({length:n}, (_,i)=>addMonths(t0, i));
    const pos = recs.map(x=>monthDiff(t0, x.date));
    const cols = {};
    Object.keys(rows[0]).filter(k=>k!=='date').forEach(k=>{
      const v = new Array(n).fill(null);
      recs.forEach((x,j)=>{ v[pos[j]] = num(x.r[k]); });
      cols[k] = (noFill||[]).includes(k) ? v : fillInterior(v);
    });
    return {dates, cols, has:k=>!!cols[k] && lastIdx(cols[k])>=0, idx:new Map(dates.map((d,i)=>[d.getTime(), i]))};
  }

  // ================= heat scale (diverging around the 2% target) =================
  const HEAT_EDGES = [-2, 0, 1, 3, 5, 8];
  const HEAT_LABELS = ['below −2%', '−2 to 0%', '0 to 1%', '1 to 3%', '3 to 5%', '5 to 8%', '8% or more'];
  const heatBin = v => (v==null || !isFinite(v)) ? null : HEAT_EDGES.filter(e=>v>=e).length;
  const heatLegend = () => `<div class="heat-legend"><span>Color = price change vs. a year ago:</span>` +
    HEAT_LABELS.map((l,i)=>`<span><i class="sw" style="background:var(--h${i})"></i>${l}</span>`).join('') +
    `<span><i class="sw" style="background:repeating-linear-gradient(45deg,var(--axis),var(--axis) 2px,var(--surface) 2px,var(--surface) 4px)"></i>smaller items not listed</span></div>`;

  // ================= squarified treemap layout (Bruls, Huizing & van Wijk) =================
  function squarify(items, rect){
    const out=[]; let {x,y,w,h}=rect; let row=[]; const rest=items.slice();
    const worst=(r, side)=>{ const s=r.reduce((a,b)=>a+b.v,0); let mx=-Infinity, mn=Infinity; r.forEach(i=>{ mx=Math.max(mx,i.v); mn=Math.min(mn,i.v); }); return Math.max(side*side*mx/(s*s), (s*s)/(side*side*mn)); };
    function layout(){
      const s=row.reduce((a,b)=>a+b.v,0); if(s<=0){ row=[]; return; }
      if(w>=h){ const cw=s/h; let cy=y; row.forEach(r=>{ const rh=r.v/cw; out.push({...r, x, y:cy, w:cw, h:rh}); cy+=rh; }); x+=cw; w-=cw; }
      else { const rh=s/w; let cx=x; row.forEach(r=>{ const rw=r.v/rh; out.push({...r, x:cx, y, w:rw, h:rh}); cx+=rw; }); y+=rh; h-=rh; }
      row=[];
    }
    while(rest.length){
      const side=Math.min(w,h), it=rest[0];
      if(!row.length || worst(row.concat(it), side) <= worst(row, side)){ row.push(it); rest.shift(); }
      else layout();
    }
    if(row.length) layout();
    return out;
  }

  /*
    explorer(cfg): a weight treemap with drill-down, a detail chart and a sortable breakdown table.
      el, id                 container element and a unique id prefix
      nodes                  [{code, name, parent, weight}]  weight = % of the total
      table                  wideTable of price index levels, one column per code
      rootCode, rootLabel    the total ('SA0' / 'DPCE')
      weightLabel            how the weight is defined (shown in the detail card)
      target                 reference line on the inflation chart (2% for PCE), optional
      movers                 element for the biggest-movers lists, optional
  */
  function explorer(cfg){
    const T = cfg.table, byCode = new Map();
    cfg.nodes.forEach(n=>byCode.set(n.code, {...n, kids:[]}));
    byCode.forEach(n=>{ if(n.parent && byCode.has(n.parent)) byCode.get(n.parent).kids.push(n); });
    byCode.forEach(n=>n.kids.sort((a,b)=>b.weight-a.weight));
    const root = byCode.get(cfg.rootCode);
    if(!root){ cfg.el.innerHTML = pending('Category data'); return null; }
    const i80 = T ? T.idx.get(Date.UTC(1980,0,1)) : null;
    byCode.forEach(n=>{
      const v = T && T.cols[n.code];
      n.has = !!v && lastIdx(v)>=0;
      if(!n.has) return;
      const li = lastIdx(v), y = yoyOf(v), f = v.findIndex(x=>x!=null);
      Object.assign(n, {level:v, yoyS:y, li, date:T.dates[li], yoy:y[li], yoyPrev: li>=12 ? y[li-12] : null, first:T.dates[f]});
      n.ann5 = li>=60 && v[li-60]!=null ? (Math.pow(v[li]/v[li-60], 1/5)-1)*100 : null;
      n.base = (i80!=null && v[i80]!=null) ? i80 : f;
      n.cum = (v[li]/v[n.base]-1)*100;
      n.contrib = n.yoy!=null && isFinite(n.yoy) ? n.weight*n.yoy/100 : null;
    });
    const path = n => { const p=[]; let c=n; while(c){ p.unshift(c); c = c.parent ? byCode.get(c.parent) : null; } return p; };
    const id = cfg.id;
    let zoom = root, sel = root, view = 'yoy', months = 0;
    // time travel: every colour, table and contribution can be shown "as of" an earlier month
    const rootLi = root.has ? root.li : 0;
    const minTi = (()=>{ const y = root.yoyS || []; const f = y.findIndex(v=>v!=null && isFinite(v)); return f<0 ? rootLi : f; })();
    let ti = rootLi;
    const okv = v => v!=null && isFinite(v);
    const yoyAt = n => n.has && n.yoyS && okv(n.yoyS[ti]) ? n.yoyS[ti] : null;
    const prevAt = n => n.has && n.yoyS && ti>=12 && okv(n.yoyS[ti-12]) ? n.yoyS[ti-12] : null;
    const contribAt = n => { const y = yoyAt(n); return y==null ? null : n.weight*y/100; };
    const depthOf = n => path(n).length-1;
    const all = [...byCode.values()].filter(n=>n!==root && n.weight>0);
    const optLabel = n => n.parent && n.parent!==cfg.rootCode && byCode.has(n.parent) ? `${n.name} · in ${byCode.get(n.parent).name}` : n.name;
    const nameToCode = new Map(all.map(n=>[optLabel(n).toLowerCase(), n.code]));
    let fSort = 'weight', fDir = -1, fLevel = 'all', fQuery = '', fHot = false, fAll = false;

    cfg.el.innerHTML = `
      <div class="card">
        <div class="ex-tools">
          <label class="ex-search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input type="search" id="${id}-q" list="${id}-names" placeholder="Search ${all.length} categories…" autocomplete="off" aria-label="Search categories"></label>
          <datalist id="${id}-names">${all.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(n=>`<option value="${esc(optLabel(n))}"></option>`).join('')}</datalist>
          <div class="ex-time" role="group" aria-label="Show the basket as of an earlier month">
            <button class="icon-btn ex-play" id="${id}-play" type="button" aria-label="Play the last five years"><svg class="i-play" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg><svg class="i-pause" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
            <input type="range" id="${id}-t" min="${minTi}" max="${rootLi}" value="${rootLi}" step="1" aria-label="Month">
            <span class="ex-when num" id="${id}-when"></span>
            <button class="ex-live" id="${id}-live" type="button" hidden>Back to latest</button>
          </div>
        </div>
        <div class="howto"><span><i class="hw-box"></i><b>Bigger box</b> = bigger share of what people spend</span><span><i class="hw-col"></i><b>Redder</b> = prices rising faster · <b>bluer</b> = prices falling</span><span><b>↑ 3.3%</b> = prices are 3.3% higher than a year ago</span></div>
        <div class="crumbs" id="${id}-crumbs"></div>
        <div class="tm" id="${id}-tm" role="group" aria-label="Treemap of category weights"></div>
        ${heatLegend()}
        <p class="cnote">Click a box to open the smaller categories inside it. Use the path above the boxes to go back up.</p>
      </div>
      <div class="grid-2" style="margin-top:12px; align-items:start">
        <div class="card" id="${id}-detail">
          <div class="card-head">
            <div><p class="card-title" id="${id}-dname"></p><p class="card-sub" id="${id}-dsub"></p></div>
            ${segControl(id+'-view', [{v:'yoy',label:'12-month change'},{v:'level',label:'Price level'}], 'yoy')}
          </div>
          <div class="detail-kpis" id="${id}-kpis"></div>
          <div class="card-head" style="align-items:center"><div class="legend" id="${id}-legend" style="margin:0"></div>
            ${segControl(id+'-range', [{v:'120',label:'10Y'},{v:'240',label:'20Y'},{v:'0',label:'Since 1980'}], '0')}</div>
          <div class="chart" id="${id}-chart" style="margin-top:8px"></div>
        </div>
        <div class="card">
          <p class="card-title" id="${id}-ttitle"></p>
          <p class="card-sub">Biggest first. “Adds to inflation” = share of spending × price change: how much of the ${esc((cfg.rootLower||cfg.rootLabel.toLowerCase()))} inflation rate comes from this item. “Points” means percentage points.</p>
          <div style="overflow-x:auto"><table class="xtable" id="${id}-table"></table></div>
        </div>
      </div>
      <div class="card" style="margin-top:12px" id="${id}-flat">
        <div class="card-head"><div><p class="card-title">Every category in one table</p><p class="card-sub" id="${id}-fsub"></p></div>
          <button class="btn sm" type="button" id="${id}-csv"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Download CSV</button></div>
        <div class="ex-filters">
          <label class="ex-search sm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="search" id="${id}-fq" placeholder="Filter by name…" aria-label="Filter categories"></label>
          ${segControl(id+'-lvl', [{v:'all',label:'All levels'},{v:'groups',label:'Major groups'},{v:'items',label:'Detailed items'}], 'all')}
          <label class="ex-check"><input type="checkbox" id="${id}-hot"> Only above 2%</label>
        </div>
        <div style="overflow-x:auto"><table class="xtable ftable" id="${id}-ftable"></table></div>
        <div style="text-align:center; margin-top:12px"><button class="btn sm" type="button" id="${id}-more"></button></div>
      </div>`;

    const tmEl = document.getElementById(id+'-tm'), chartEl = document.getElementById(id+'-chart');
    const tip = document.createElement('div'); tip.className='tip';

    function select(code){
      const n = byCode.get(code); if(!n) return;
      if(n.kids.length) zoom = n; else if(n.parent && byCode.has(n.parent)) zoom = byCode.get(n.parent);
      sel = n;
      render();
    }

    function crumbs(){
      const p = path(zoom);
      let h = p.map((n,i)=> i===p.length-1 && sel===zoom ? `<span class="cur">${esc(n.name)}</span>` : `<button data-code="${n.code}">${esc(n.name)}</button>`).join('<span class="sep">›</span>');
      if(sel!==zoom) h += `<span class="sep">›</span><span class="cur">${esc(sel.name)}</span>`;
      const el = document.getElementById(id+'-crumbs');
      el.innerHTML = h;
      el.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ const n=byCode.get(b.dataset.code); zoom=n; sel=n; render(); }));
    }

    function drawTM(el){
      const W = el.clientWidth || 800;
      const H = W < 520 ? Math.round(W*1.1) : Math.round(Math.min(560, Math.max(360, W*0.42)));
      el.style.height = H+'px';
      const kids = zoom.kids.filter(k=>k.weight>0);
      const sumK = kids.reduce((s,k)=>s+k.weight,0), other = zoom.weight - sumK;
      const items = kids.map(k=>({node:k, v:k.weight}));
      if(other > zoom.weight*0.02) items.push({other:true, v:other});
      items.sort((a,b)=>b.v-a.v);
      const tot = items.reduce((s,i)=>s+i.v,0) || 1, sc = W*H/tot;
      const rects = squarify(items.map(i=>({...i, v:i.v*sc})), {x:0, y:0, w:W, h:H});
      el.innerHTML = rects.map((r,k)=>{
        const st = `left:${(r.x+1).toFixed(1)}px;top:${(r.y+1).toFixed(1)}px;width:${Math.max(0,r.w-2).toFixed(1)}px;height:${Math.max(0,r.h-2).toFixed(1)}px;`;
        if(r.other) return `<div class="tm-tile other" data-k="${k}" style="${st}">${r.w>80 && r.h>34 ? `<span class="tm-name">Other items</span><span class="tm-meta">${(r.v/sc).toFixed(2)}% of spending</span>` : ''}</div>`;
        const n = r.node, ny = yoyAt(n), b = heatBin(ny);
        const color = b==null ? 'background:var(--grid);color:var(--ink-2);' : `background:var(--h${b});color:var(--hi${b});`;
        const big = r.w>220 && r.h>120, showName = r.w>=66 && r.h>=36, showMeta = r.w>=46 && r.h>=22, roomy = r.w>=200 && r.h>=84;
        const wTxt = n.weight.toFixed(n.weight>=10?1:2)+'%', arrow = ny==null ? '' : ny>=0.05 ? '↑ ' : ny<=-0.05 ? '↓ ' : '';
        const pTxt = ny==null ? 'no price data' : arrow + Math.abs(ny).toFixed(1) + '%';
        // hero number = price change; scales with the tile so big categories read big
        const vSize = Math.round(Math.max(15, Math.min(r.w*0.13, r.h*0.2, 44)));
        const meta = `<span class="tm-val" style="font-size:${vSize}px">${pTxt}</span><span class="tm-meta">${wTxt} of spending</span>`;
        return `<button class="tm-tile${big?' tm-big':''}" data-code="${n.code}" data-k="${k}" aria-pressed="${n===sel}" style="${st}${color}" aria-label="${esc(n.name)}: ${n.weight.toFixed(2)}% of all spending, prices ${ny!=null?spct(ny):'not available'} versus a year ago">
          ${showName?`<span class="tm-name">${esc(n.name)}</span>`:''}${showMeta?(showName && r.h>=70 ? meta : `<span class="tm-meta">${ny!=null?pTxt:''}</span>`):''}
          ${n.kids.length && r.h>=100 && r.w>=90 ? `<span class="tm-kids">${n.kids.length} ${r.w>=160 ? `categor${n.kids.length>1?'ies':'y'} inside` : 'inside'} ›</span>` : ''}</button>`;
      }).join('');
      el.appendChild(tip);
      el.querySelectorAll('.tm-tile').forEach(t=>{
        const r = rects[+t.dataset.k];
        const show = e=>{
          tip.textContent='';
          const add=(cls, txt)=>{ const d=document.createElement('div'); d.className=cls; d.textContent=txt; tip.appendChild(d); return d; };
          const row=(k,v)=>{ const d=document.createElement('div'); d.className='t-row'; const a=document.createElement('span'); a.className='t-key'; a.textContent=k; const b=document.createElement('b'); b.textContent=v; d.appendChild(a); d.appendChild(b); tip.appendChild(d); };
          if(r.other){ add('t-date','Other items'); row('Share of all spending', (r.v/sc).toFixed(2)+'%'); add('t-note','Smaller categories not listed separately'); }
          else {
            const n=r.node; add('t-date', n.name);
            row('Share of all spending', n.weight.toFixed(2)+'%');
            row('Price change vs. a year ago', yoyAt(n)!=null?spct(yoyAt(n)):'n/a');
            if(prevAt(n)!=null) row('Same measure a year earlier', spct(prevAt(n)));
            if(contribAt(n)!=null) row('Adds to total inflation', pp(contribAt(n),2));
            if(n.kids.length) add('t-note', `Click to open ${n.kids.length} smaller categor${n.kids.length>1?'ies':'y'}`);
          }
          tip.style.opacity=1;
          const box = el.getBoundingClientRect(), px=e.clientX-box.left, py=e.clientY-box.top;
          let left = px+14; if(left+tip.offsetWidth > box.width) left = px-tip.offsetWidth-14;
          let top = py+14; if(top+tip.offsetHeight > box.height) top = py-tip.offsetHeight-10;
          tip.style.left=Math.max(0,left)+'px'; tip.style.top=Math.max(0,top)+'px';
        };
        t.addEventListener('pointermove', show);
        t.addEventListener('pointerleave', ()=>{ tip.style.opacity=0; });
        if(!r.other) t.addEventListener('click', ()=>select(t.dataset.code));
      });
    }

    function drawDetail(el){
      const n = sel;
      if(!n.has){ el.innerHTML = '<div class="empty">No price history published for this category.</div>'; return; }
      const start = months ? addMonths(n.date, -months) : parseDate('1980-01-01');
      const idx = []; for(let i=0;i<T.dates.length;i++){ if(T.dates[i]>=start && i<=n.li) idx.push(i); }
      const r = byCode.get(cfg.rootCode), cmp = n!==r && r.has;
      if(view==='yoy'){
        lineChart({aria:n.name+' 12-month change', height:H(300,230), dates:idx.map(i=>T.dates[i]),
          series:(cmp?[{label:cfg.rootLabel, cls:'ref', values:idx.map(i=>r.yoyS[i])}]:[]).concat([{label:n.name, cls:'actual', values:idx.map(i=>n.yoyS[i]), endMarker:true}]),
          refs: cfg.target ? [{value:cfg.target, label:''}] : [], zeroLine:true, yFmt:(v,d)=>v.toFixed(d)+'%', tipFmt:v=>v.toFixed(1)+'%'})(el);
      } else {
        const b0 = idx.find(i=>n.level[i]!=null), rb = idx.find(i=>r.level && r.level[i]!=null);
        const b = cmp ? Math.max(b0, rb) : b0;
        const ix = idx.filter(i=>i>=b);
        lineChart({aria:n.name+' price level', height:H(300,230), dates:ix.map(i=>T.dates[i]),
          series:(cmp?[{label:cfg.rootLabel, cls:'ref', values:ix.map(i=>r.level[i]/r.level[b]*100)}]:[]).concat([{label:n.name, cls:'actual', values:ix.map(i=>n.level[i]/n.level[b]*100), endMarker:true, endLabel:'above'}]),
          refs:[{value:100, label:''}], endFmt:v=>v.toFixed(0), yFmt:(v,d)=>v.toFixed(d), tipFmt:v=>v.toFixed(1)})(el);
      }
    }

    function detail(skipChart){
      const n = sel, r = byCode.get(cfg.rootCode);
      document.getElementById(id+'-dname').textContent = n.name;
      document.getElementById(id+'-dsub').innerHTML = n===r ? `${esc(cfg.weightLabel)}. Data through ${n.has?fmtMonthLong(n.date):'—'}.`
        : `Weight <b style="color:var(--ink)">${n.weight.toFixed(3)}%</b> of ${esc((cfg.rootLower||cfg.rootLabel.toLowerCase()))} (${esc(cfg.weightLabel)})${n.has?` · data ${n.first.getUTCFullYear()}–${fmtMonth(n.date)}`:''}.`;
      const sinceYr = n.has ? T.dates[n.base].getUTCFullYear() : 1980;
      document.getElementById(id+'-kpis').innerHTML = n.has ? `
        <div class="k"><div class="l">12-month change${ti!==rootLi?', '+fmtMonth(T.dates[ti]):''}</div><div class="v">${spct(yoyAt(n))}</div></div>
        <div class="k"><div class="l">A year earlier</div><div class="v">${spct(prevAt(n))}</div></div>
        <div class="k"><div class="l">Per year, last 5 years</div><div class="v">${spct(n.ann5)}</div></div>
        <div class="k"><div class="l">Total since ${sinceYr}</div><div class="v">${spct(n.cum,0)}</div></div>` : '';
      const cmp = n!==r && r.has;
      document.getElementById(id+'-legend').innerHTML = `<span><i class="key-line" style="background:var(--c-actual)"></i>${esc(n.name)}</span>` + (cmp?`<span><i class="key-line" style="background:var(--c-ref)"></i>${esc(cfg.rootLabel)}</span>`:'') + (view==='level'?`<span class="muted">Index, start of period = 100</span>`:'');
