          <span class="hb-track"><span class="hb-bar pos ${isM?'c-model':isN?'c-ref':''}" style="left:0;width:${(r.mae/maxMae*100).toFixed(1)}%"></span></span>
          <span class="hb-v">${r.mae.toFixed(3)}</span><span class="hb-v hb-rmse">${r.rmse.toFixed(3)}</span></div>`;
      }).join('') + `</div>`;

    // ---- model competition + findings ----
    const bm = bmRaw.map(r=>({model:r.model, label:r.label, n:+r.n, mae:num(r.mae), rmse:num(r.rmse), vs:num(r.mae_vs_naive_pct), p:num(r.dm_pvalue), pA:num(r.dm_pvalue_vs_arima)})).filter(r=>r.mae!=null);
    const bmBy = Object.fromEntries(bm.map(r=>[r.model, r]));
    const fmtP = p => p==null ? '—' : p < 0.001 ? '< 0.001' : p.toFixed(3);
    const sigWord = p => p==null ? '' : p < 0.05 ? 'statistically significant at the 5% level' : p < 0.10 ? 'only weakly significant (10% level)' : 'not statistically significant';
    (function(){
      const card = document.getElementById('benchCard');
      if(!bm.length){ card.innerHTML = pending('The model competition'); return; }
      const maxM = Math.max(...bm.map(r=>r.mae));
      const rows = bm.slice().sort((a,b)=>a.mae-b.mae);
      card.innerHTML = `<p class="card-title">One-month-ahead accuracy, last ${bm[0].n} months</p>
        <p class="card-sub">Lower is better. A p-value below 0.05 means a model’s edge over just repeating today’s rate is unlikely to be luck.</p>
        <div style="overflow-x:auto"><table class="bm-table"><thead><tr><th>Model</th><th>Avg miss (points)</th><th class="r">RMSE</th><th class="r">vs repeating today’s rate</th><th class="r">p-value</th></tr></thead><tbody>
        ${rows.map(r=>`<tr class="${r.model==='arima'?'em':''}"><td class="model">${esc(r.model==='naive'?'Just repeating today’s rate':r.label)}${r.model==='arima'?'<span class="tag">in use</span>':''}</td>
          <td><span class="bm-bar ${r.model==='arima'?'c-model':r.model==='naive'?'c-ref':''}" style="width:${(r.mae/maxM*110).toFixed(0)}px"></span>${r.mae.toFixed(3)}</td>
          <td class="r">${r.rmse.toFixed(3)}</td><td class="r">${r.model==='naive'?'—':spct(r.vs)}</td><td class="r">${r.model==='naive'?'—':fmtP(r.p)}</td></tr>`).join('')}
        </tbody></table></div>`;
    })();

    (function(){
      const body = document.getElementById('findingsBody');
      const items = [];
      const A = bmBy.arima, N = bmBy.naive;
      // 2. more data / ML
      const X = bmBy.arimax, G = bmBy.gbm;
      if(A && (X || G)){
        const challengers = [X, G].filter(Boolean);
        const best = challengers.slice().sort((a,b)=>a.mae-b.mae)[0];
        const beats = best.mae < A.mae;
        const rel = m => ((m.mae/A.mae-1)*100);
        const sigB = best.pA!=null && best.pA<0.05;
        const parts = challengers.map(m=>`${m.model==='arimax'?'adding last month\'s energy and core inflation (ARIMAX)':'gradient-boosted trees'} ${rel(m)<0?'cut':'raised'} ARIMA's average error by ${Math.abs(rel(m)).toFixed(1)}%`);
        items.push({title: beats && sigB ? `${esc(best.label)} beats the simple model` : beats ? `Machine learning did a bit better, not yet proven` : 'More data and machine learning didn\u2019t help',
          short: beats ? `A machine-learning model made ${Math.abs(rel(best)).toFixed(0)}% smaller mistakes than my main model${sigB ? '.' : `. Promising, but ${A.n} months of testing isn’t enough to rule out luck.`}` : `Adding more data and machine learning did not beat the simple model.`,
          stat: challengers.map(m=>`${esc(m.label)}: ${spct(rel(m))} vs ARIMA (p = ${fmtP(m.pA)})`).join(' · '),
          text: `Over the same ${A.n} months, ${parts.join(', while ')}.
            ${best.pA!=null ? `For the best challenger the Diebold-Mariano test against ARIMA gives p = ${fmtP(best.pA)}: ${sigWord(best.pA)}.` : ''}
            ${beats && !sigB ? 'With this few test months a gap of that size can still arise by chance; a longer evaluation window would be needed to confirm it.' : beats ? 'The richer model is a candidate to replace ARIMA as the production forecast.' : 'Most of the predictable signal is already captured by recent inflation itself.'}`,
          link:'#track-record'});
      }
      // 3. horizon
      const hz = hzRaw.map(r=>({h:+r.horizon, m:num(r.model_mae), nv:num(r.naive_mae), cov:num(r.coverage_95), n:+r.n})).filter(r=>r.m!=null).sort((a,b)=>a.h-b.h);
      if(hz.length){
        const f=hz[0], l=hz[hz.length-1], g = r => (1-r.m/r.nv)*100;
        items.push({title: g(l) > g(f) ? 'Most useful for long-range forecasts' : 'No extra edge further out',
          short: `Predicting a year ahead, it is ${g(l).toFixed(0)}% more accurate than just repeating today’s inflation rate. For next month it is only ${g(f).toFixed(0)}% better, because next month is easy to guess anyway.`,
          stat: `${f.h}-month: ${g(f).toFixed(0)}% more accurate than repeating today’s rate · ${l.h}-month: ${g(l).toFixed(0)}% more accurate`,
          text: `One month ahead, the model's edge over just repeating today’s rate is ${g(f).toFixed(0)}%. Twelve months ahead it is ${g(l).toFixed(0)}% (${l.m.toFixed(2)} vs ${l.nv.toFixed(2)} points), because the model pulls forecasts back toward the long-run average while repeating today’s rate keeps assuming nothing will change.`,
          link:'#track-record'});
        const avgCov = hz.reduce((s,r)=>s+r.cov*r.n,0)/hz.reduce((s,r)=>s+r.n,0);
        items.push({title: Math.abs(avgCov-95) <= 4 ? 'Its uncertainty ranges can be trusted' : avgCov < 95 ? 'Its uncertainty ranges are too narrow' : 'Its uncertainty ranges are too wide',
          short: `Each forecast comes with a range (“most likely between X and Y”). The real number landed inside that range ${avgCov.toFixed(0)}% of the time, close to the 95% it promises.`,
          stat: `${avgCov.toFixed(0)}% of outcomes inside the 95% interval`,
          text: `Across all horizons, the actual inflation rate landed inside the model's 95% interval ${avgCov.toFixed(0)}% of the time. A forecast that states its uncertainty correctly is often more useful than a slightly sharper point estimate.`,
          link:'#forecast'});
      }
      // 5. turning points
      const eA = bmErrRaw.filter(r=>r.model==='arima').map(r=>({date:parseDate(r.date), err:num(r.error), actual:num(r.actual)}));
      if(eA.length){
        const worst = eA.reduce((a,b)=>Math.abs(b.err)>Math.abs(a.err)?b:a);
        const prevD = cpiAt.get(addMonths(worst.date,-1).getTime());
        const jump = prevD ? worst.actual - prevD.yoy : null;
        const same = bmErrRaw.filter(r=>r.date===isoDate(worst.date) && r.model!=='arima').map(r=>`${r.model==='naive'?'Just repeating today’s rate':(bmBy[r.model]||{label:r.model}).label} ${pp(num(r.error),2)}`);
        const others = same.length ? ` The other models missed that month too: ${esc(same.join(', '))}.` : '';
        items.push({title:'Sudden turns catch it out',
          short:`Over the last ${eA.length} months of testing, its biggest miss was ${fmtMonthLong(worst.date)}${jump!=null ? ', when inflation suddenly '+(jump>0?'jumped ':'fell ')+Math.abs(jump).toFixed(1)+' points in a single month' : ''}. It only sees past inflation, so it reacts to surprises a month late.`,
          stat:`Biggest miss in the last ${eA.length} months: ${pp(worst.err,2)} in ${fmtMonth(worst.date)}`,
          text:`The biggest error came in ${fmtMonthLong(worst.date)}, when inflation ${jump!=null ? (jump>0?'jumped':'fell')+' '+Math.abs(jump).toFixed(2)+' points in a single month' : 'moved sharply'}. A model that only sees past inflation cannot anticipate sudden shifts such as energy price swings; it reacts a month late.${others}`,
          link:'#track-record'});
      }
      // 6. data quality
      const rawRows = cpiRaw.map(r=>({date:parseDate(r.date), cpi:num(r.cpi)})).filter(r=>r.cpi!=null).sort((a,b)=>a.date-b.date);
      let maxDiff = 0, diffAt = null;
      rawRows.forEach((r,i)=>{ if(i<12) return; const naiveYoY=(r.cpi/rawRows[i-12].cpi-1)*100; const d=cpiAt.get(r.date.getTime()); if(d && d.yoy!=null){ const diff=Math.abs(naiveYoY-d.yoy); if(diff>maxDiff){ maxDiff=diff; diffAt=r.date; } } });
      if(maxDiff > 0.05){
        items.push({title:'Caught a hidden gap in the data',
          short:`The government never published October 2025 prices because of a government shutdown. A common shortcut would have made inflation look up to ${maxDiff.toFixed(2)} points higher than it really was; this site fills the gap properly.`,
          stat:`Up to ${maxDiff.toFixed(2)} points of error avoided`,
          text:`BLS never published October 2025 CPI because of a federal government shutdown. Computing year-over-year inflation by counting back twelve rows, a common shortcut, would silently compare against the wrong month for the following year, overstating inflation by as much as ${maxDiff.toFixed(2)} points (${fmtMonth(diffAt)}). The pipeline rebuilds a complete monthly calendar and interpolates the gap instead.`,
          link:null});
      }
      // 7. CPI vs PCE
      if(pceSeries.length){
        const gaps = pceSeries.filter(p=>p.date>=parseDate('2000-01-01')).map(p=>{ const c=cpiAt.get(p.date.getTime()); return c && c.yoy!=null ? c.yoy-p.v : null; }).filter(v=>v!=null);
        if(gaps.length>24){
          const avg = gaps.reduce((a,b)=>a+b,0)/gaps.length, nowGap = gaps[gaps.length-1];
          const shelterCPI = (cpiNodes.find(n=>n.code==='SAH1')||{}).weight, housePCE = (pceNodes.find(n=>n.code==='DHSG')||{}).weight;
          const healthCPI = (cpiNodes.find(n=>n.code==='SAM')||{}).weight, healthPCE = (pceNodes.find(n=>n.code==='DHLC')||{}).weight;
          items.push({title: avg>0 ? 'CPI usually runs higher than PCE' : 'CPI and PCE tell a similar story',
            short: `The government measures prices two ways, CPI and PCE, and they don’t quite agree. Since 2000, CPI has come out about ${Math.abs(avg).toFixed(1)} ${avg>0?'higher':'lower'} on average (think ${(3+avg).toFixed(1)}% instead of 3.0%)${shelterCPI&&housePCE ? `, mostly because rent and housing are ${shelterCPI.toFixed(0)}% of CPI but only ${housePCE.toFixed(0)}% of PCE` : ''}.`,
            stat:`CPI − PCE gap: ${pp(avg,2)} on average since 2000, ${pp(nowGap,2)} now`,
            text:`Since 2000, CPI inflation has averaged ${Math.abs(avg).toFixed(2)} points ${avg>0?'above':'below'} PCE inflation. ${shelterCPI&&housePCE?`Housing is ${shelterCPI.toFixed(0)}% of the CPI basket but only ${housePCE.toFixed(0)}% of PCE, `:''}${healthCPI&&healthPCE?`while health care is ${healthCPI.toFixed(0)}% of CPI against ${healthPCE.toFixed(0)}% of PCE, because PCE also counts care paid for by employers and government. `:''}PCE's chain-weighting also lets households' switching between products pull the index down. The Fed targets PCE, so a 2% PCE goal is roughly 2.3–2.5% in CPI terms.`,
            link:'#pce'});
        }
      }
      // 8. interest rates
      const r10 = rate('gs10');
      if(r10 && r10.hz.length){
        const h1 = r10.hz[0], h12 = r10.hz[r10.hz.length-1], g = r => (1-r.m/r.nv)*100;
        items.push({title: g(h12) <= 0 || Math.max(g(h1), g(h12)) < 5 ? 'Interest rates are hard to predict' : 'The rate model adds a little',
          short: g(h12) <= 0 ? `A year ahead, my 10-year interest rate forecast is no better than assuming rates stay where they are. Markets already price in the news.` : `A year ahead, my 10-year interest rate forecast is only ${g(h12).toFixed(0)}% better than assuming rates stay where they are.`,
          stat:`10-year yield: ${h12.h}-month error ${h12.m.toFixed(2)} vs ${h12.nv.toFixed(2)} points for repeating today’s rate`,
          text:`Over the last ${h1.n} months, the 10-year yield model missed by ${h1.m.toFixed(2)} points one month ahead (just repeating today’s rate: ${h1.nv.toFixed(2)}) and ${h12.m.toFixed(2)} points twelve months ahead (repeating today’s rate: ${h12.nv.toFixed(2)}).
            Bond prices already reflect public information, so today's yield is the best simple forecast of tomorrow's. The value of the model lies in its likely range: ${h12.cov.toFixed(0)}% of outcomes fell inside it at twelve months.`,
          link:'#rates'});
      }
      body.innerHTML = items.length ? items.map((it,i)=>`<div class="card finding"><span class="n">${i+1}</span><div><h3>${it.title}</h3><p class="short">${it.short}</p>
          <div class="f-foot">${it.link?`<a class="link-more" href="${it.link}">See the data →</a>`:''}<details><summary>Details for the curious</summary><p>${it.text}</p><span class="stat">${it.stat}</span></details></div></div></div>`).join('') : pending('Findings');
    })();

    // accuracy by horizon
    (function(){
      const card = document.getElementById('horizonCard');
      const hz = hzRaw.map(r=>({h:+r.horizon, n:+r.n, m:num(r.model_mae), nv:num(r.naive_mae), cov:num(r.coverage_95)})).filter(r=>r.m!=null).sort((a,b)=>a.h-b.h);

        <p class="card-title">Average miss, by how far ahead</p>
        <p class="card-sub">${h1.h} month ahead: ${h1.m.toFixed(2)} points off, versus ${h1.nv.toFixed(2)} for just repeating today’s rate. ${hL.h} months ahead: ${hL.m.toFixed(2)} versus ${hL.nv.toFixed(2)}.
          Across all the time spans tested, the real number landed inside the model’s likely range ${avgCov.toFixed(0)}% of the time, so the range is ${calib}.
          This test covers the last ${hz[0].n} months, a longer window than the ${errModel.length||24} months at the top of the page, so its 1-month figure differs.</p>
        <div class="legend"><span><i class="key-area" style="background:var(--c-model)"></i>The model</span><span><i class="key-area" style="background:var(--c-ref)"></i>Just repeating today’s rate</span></div>
        <div class="hz-row hz-head"><span>Months ahead</span><span>Average miss (points)</span><span class="hz-cov">Inside likely range</span></div>
        ${pick.map(r=>`<div class="hz-row"><span>${r.h} month${r.h>1?'s':''}</span>
          <span class="hz-bars">
            <span class="hz-bar"><span class="b model" style="width:${(r.m/maxV*85).toFixed(1)}%"></span><span class="v">${r.m.toFixed(2)}</span></span>
            <span class="hz-bar"><span class="b naive" style="width:${(r.nv/maxV*85).toFixed(1)}%"></span><span class="v">${r.nv.toFixed(2)}</span></span>
          </span>
          <span class="hz-cov">${r.cov.toFixed(0)}% <span class="muted" style="font-size:12px">of ${r.n}</span></span></div>`).join('')}`;
    })();

    // archive
    (function(){
      const card = document.getElementById('archiveCard');
      const ar = arRaw.map(r=>({vintage:parseDate(r.vintage), target:parseDate(r.target_date), h:+r.horizon, f:num(r.forecast), lo:num(r.lower_95), hi:num(r.upper_95)})).filter(r=>r.f!=null);
      if(!ar.length){ card.innerHTML = pending('The forecast archive'); return; }
      const vintages = [...new Set(ar.map(r=>r.vintage.getTime()))].sort();

      let inv=0; const s80 = spread.filter(p=>p.date>=parseDate('1980-01-01')); s80.forEach(p=>{ if(p.v<0) inv++; });
      const lastInv = s80.slice().reverse().find(p=>p.v<0);
      const ttl = r10 ? `The 10-year Treasury yield is ${pct(r10.last.v,2)}.` : 'Interest rates';
      body.innerHTML = `
        <div class="eyebrow"><span class="pill"><span class="dot"></span>Monthly averages through ${fmtMonthLong((r10||RATES[0]).last.date)}</span><span>Federal Reserve H.15 via FRED</span></div>
        <h1>${ttl}</h1>
        <p class="lede">Where interest rates are now, and where the model thinks they’ll be a year from now.</p>
        ${ratesTicker}
        <div class="grid-4">${RATES.map(r=>{ const f=fc12(r), ch = r.yearAgo ? r.last.v-r.yearAgo.v : null;
          return `<div class="kpi"><div class="kpi-label"><span class="key-swatch" style="background:var(${COLOR_VAR[r.cls]})"></span>${r.label}</div><div class="kpi-value num">${pct(r.last.v,2)}</div>
            <div class="kpi-sub">${f?`Projected next year: ${pct(f.mean,2)}`:''}</div></div>`; }).join('')}</div>
        <div class="card" style="margin-top:12px">
          <div class="card-head"><div><p class="card-title" id="rtTitle"></p><p class="card-sub" id="rtSub"></p></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">${segControl('rtWhich', RATES.map(r=>({v:r.key,label:r.short})), r10?'gs10':RATES[0].key)}${segControl('rtRange', [{v:'60',label:'5Y'},{v:'120',label:'10Y'},{v:'0',label:'Since 1980'}], '60')}</div></div>
          ${forecastLegend}<div class="chart" id="rtChart"></div>
        </div>
        <div class="grid-2" style="margin-top:12px">
          <div class="card"><p class="card-title">Forecast by month</p><p class="card-sub">The model’s best guess for each month’s average rate.</p>
            <div style="overflow-x:auto"><table><thead><tr><th>Month</th>${RATES.map(r=>`<th class="r">${r.short}</th>`).join('')}</tr></thead><tbody>
            ${(RATES.find(r=>r.fc.length)||{fc:[]}).fc.map((f,i)=>`<tr><td>${fmtMonth(f.date)}</td>${RATES.map(r=>`<td class="r">${r.fc[i]?pct(r.fc[i].mean,2):'—'}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="5">${pending('Rate forecasts')}</td></tr>`}</tbody></table></div></div>
          <div class="card"><p class="card-title">Rates by length of loan</p><p class="card-sub">What the government pays to borrow for different lengths of time. Normally, longer loans pay more. When it is the other way around, the curve is called “inverted”.</p>
            <div class="legend" id="rtCurveLegend"></div><div class="chart" id="rtCurve"></div></div>
        </div>
        <h2>Treasury yields since 1980</h2>
        <p class="sec-sub">From double-digit rates in the early 1980s, to near zero after 2008 and 2020, and back up in 2022–23.</p>
        <div class="card">
          <div class="card-head"><div class="legend" style="margin:0">${RATES.map(r=>`<span><i class="key-line" style="background:var(${COLOR_VAR[r.cls]})"></i>${r.label}</span>`).join('')}</div>
            ${segControl('ryRange', [{v:'120',label:'10Y'},{v:'240',label:'20Y'},{v:'0',label:'Since 1980'}], '0')}</div>
          <div class="chart" id="ryChart" style="margin-top:8px"></div>
        </div>
        <div class="grid-2" style="margin-top:12px">
          <div class="card"><p class="card-title">Gap between 10-year and 2-year rates</p>
            <p class="card-sub">${sNow?`Now ${pp(sNow.v,2).replace(' pp',' points')}. `:''}When it drops below zero the curve is “inverted”: ${inv} months since 1980${lastInv?`, most recently ${fmtMonth(lastInv.date)}`:''}.</p>
            <div class="chart" id="spreadChart"></div></div>
          <div class="card"><p class="card-title">Mortgage rates follow the 10-year</p>
            <p class="card-sub">30-year fixed mortgage rate (Freddie Mac) and the 10-year Treasury yield, monthly averages.</p>
            <div class="legend"><span><i class="key-line" style="background:var(--c-8)"></i>30-year mortgage</span><span><i class="key-line" style="background:var(--c-3)"></i>10-year Treasury</span></div>
            <div class="chart" id="mortChart"></div></div>
        </div>
        <div class="card" style="margin-top:12px"><p class="card-title">What is inside the 10-year rate</p>
          <p class="card-sub">The 10-year rate is roughly the “real” return (after inflation) plus the inflation investors expect over the next 10 years.</p>
          <div class="legend"><span><i class="key-line" style="background:var(--c-3)"></i>10-year rate</span><span><i class="key-line" style="background:var(--c-4)"></i>Real return (after inflation)</span><span><i class="key-line" style="background:var(--c-model)"></i>Inflation investors expect</span></div>
          <div class="chart" id="realChart"></div></div>
        <h2>Track record</h2>
        <p class="sec-sub">Average miss, in percentage points, over the last 48 months. Each forecast used only the data available at the time. “Same as today” means guessing the rate stays where it is.</p>
        <div class="card" style="overflow-x:auto">${RATES.some(r=>r.hz.length)?`<table><thead><tr><th>Rate</th>${[1,3,6,12].map(h=>`<th class="r">${h} mo: model</th><th class="r hide-sm">same as today</th>`).join('')}<th class="r">Inside likely range</th></tr></thead><tbody>
          ${RATES.filter(r=>r.hz.length).map(r=>{ const cov = r.hz.reduce((s,x)=>s+x.cov*x.n,0)/r.hz.reduce((s,x)=>s+x.n,0);
            return `<tr><td>${r.label}</td>${[1,3,6,12].map(h=>{ const x=r.hz.find(z=>z.h===h); return x?`<td class="r"><b class="${x.m<x.nv?'down-good':''}">${x.m.toFixed(2)}</b></td><td class="r muted hide-sm">${x.nv.toFixed(2)}</td>`:'<td></td><td class="hide-sm"></td>'; }).join('')}<td class="r">${cov.toFixed(0)}%</td></tr>`; }).join('')}
          </tbody></table><p class="note">Green: the model beat “same as today” at that horizon.</p>`:pending('The rates backtest')}</div>`;

      let which = r10 ? 'gs10' : RATES[0].key, months = 60;
      const el = document.getElementById('rtChart');
      mount(el, el=>{
        const r = rate(which), f = fc12(r);
        document.getElementById('rtTitle').textContent = `${r.label} and forecast`;
        document.getElementById('rtSub').textContent = f ? `${pct(r.last.v,2)} now. Projected next year: ${pct(f.mean,2)}.` : '';
        const hist = months ? r.s.slice(-months) : r.s.filter(p=>p.date>=parseDate('1980-01-01'));
        lineChart(histFcCfg({aria:r.label+' forecast', hist, fc:r.fc, dec:2, height:H(360,270)}))(el);
      });
      bindSeg('rtWhich', v=>{ which=v; el.__draw(el); });
      bindSeg('rtRange', v=>{ months=+v; el.__draw(el); });

      drawCurve(document.getElementById('rtCurve'), document.getElementById('rtCurveLegend'), 260);

      let ym = 0; const yEl = document.getElementById('ryChart');
      mount(yEl, el=>{
        const li = Math.max(...RATES.map(r=>r.last.i)), start = ym ? addMonths(X.dates[li], -ym) : parseDate('1980-01-01');
        const ix = []; X.dates.forEach((d,i)=>{ if(d>=start && i<=li) ix.push(i); });
        lineChart({aria:'Treasury yields since 1980', height:H(360,270), dates:ix.map(i=>X.dates[i]),
          series:RATES.map(r=>({label:r.short, cls:r.cls, values:ix.map(i=>X.cols[r.key][i]), endMarker:true})),
          zeroLine:true, yFmt:(v,d)=>v.toFixed(d)+'%', tipFmt:v=>v.toFixed(2)+'%'})(el);
      });
      bindSeg('ryRange', v=>{ ym=+v; yEl.__draw(yEl); });

      if(spread.length) mount(document.getElementById('spreadChart'), lineChart({aria:'10-year minus 2-year spread', height:H(240,220), dates:s80.map(p=>p.date),
        series:[{label:'10y − 2y', cls:'c4', values:s80.map(p=>p.v), endMarker:true}], zeroLine:true, area:true, yFmt:(v,d)=>v.toFixed(d), tipFmt:v=>(v>0?'+':'')+v.toFixed(2)+' pts'}));
      else document.getElementById('spreadChart').innerHTML = pending('Spread data');

      const mort = seriesFrom('mortgage_30y'), tips = seriesFrom('tips_10y');
      const mEl = document.getElementById('mortChart');
      if(mort && r10){ const st = addMonths(r10.last.date, -240), ix=[]; X.dates.forEach((d,i)=>{ if(d>=st && i<=r10.last.i) ix.push(i); });
        mount(mEl, lineChart({aria:'Mortgage rate vs 10-year yield', height:H(240,220), dates:ix.map(i=>X.dates[i]),
          series:[{label:'10-year Treasury', cls:'c3', values:ix.map(i=>X.cols.gs10[i])}, {label:'30-year mortgage', cls:'c8', values:ix.map(i=>X.cols.mortgage_30y[i]), endMarker:true}],
          yFmt:(v,d)=>v.toFixed(d)+'%', tipFmt:v=>v.toFixed(2)+'%'})); }
      else mEl.innerHTML = pending('Mortgage rate data');

      const rEl = document.getElementById('realChart');
      if(tips && r10){ const st = tips[0].date, ix=[]; X.dates.forEach((d,i)=>{ if(d>=st && i<=r10.last.i) ix.push(i); });
        mount(rEl, lineChart({aria:'Nominal and real 10-year yield', height:H(260,230), dates:ix.map(i=>X.dates[i]),
          series:[{label:'10-year rate', cls:'c3', values:ix.map(i=>X.cols.gs10[i]), endMarker:true}, {label:'Real return (after inflation)', cls:'c4', values:ix.map(i=>X.cols.tips_10y[i]), endMarker:true},
                  {label:'Inflation investors expect', cls:'model', values:ix.map(i=>X.has('exp_market_10y')?X.cols.exp_market_10y[i]:null)}],
          zeroLine:true, yFmt:(v,d)=>v.toFixed(d)+'%', tipFmt:v=>v.toFixed(2)+'%'})); }
      else rEl.innerHTML = pending('TIPS yield data');
    })();

    // =============== router ===============
    const PAGES = ['overview','findings','forecast','track-record','drivers','history','pce','pce-categories','rates','fed','money','expectations'];
    function show(){
      let id = (location.hash||'').slice(1);
      if(id==='prices') id = 'drivers';         // old link: every CPI item now lives on the CPI tab
      if(id==='methodology') id = 'findings';   // old link: methodology is now chapter 3 of the story
      if(!PAGES.includes(id)) id = 'overview';
      document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active', p.id==='page-'+id));
      document.querySelectorAll('.nav-link').forEach(a=>a.setAttribute('aria-current', a.getAttribute('href')==='#'+groupOf(id) ? 'page' : 'false'));
      const title = document.getElementById('page-'+id).dataset.title;
      document.title = id==='overview' ? SITE : `${title} · ${SITE}`;
      window.scrollTo(0,0);
      const active = document.querySelector('.nav-link[aria-current="page"]');
      if(active && window.innerWidth<=900) active.scrollIntoView({inline:'center', block:'nearest'});
      requestAnimationFrame(redrawVisible);
    }
    // keep each page to roughly one screen: secondary content goes behind "More detail"
    function fold(pageId, startEl){
      if(!startEl) return;
      const d = document.createElement('details'); d.className = 'fold';
      d.innerHTML = '<summary>More detail</summary><div class="fold-body"></div>';
      const body = d.lastChild; startEl.parentElement.insertBefore(d, startEl);
      let n = startEl; while(n){ const nx = n.nextSibling; if(n.classList && n.classList.contains('page-foot')) break; body.appendChild(n); n = nx; }
    }
    const $ = sel => document.querySelector(sel), card = sel => { const e=$(sel); return e ? e.closest('.card') : null; };
    fold('forecast', $('#page-forecast > .grid-2'));
    fold('drivers', $('#cpiMoreH'));
    fold('history', card('#momChart'));
    fold('pce', $('#pceBody > .grid-2'));
    fold('rates', $('#ratesBody > .grid-2'));
    fold('money', $('#page-money > h2'));
    fold('expectations', $('#expBody > .card:last-child'));
    // five sections in the sidebar; related pages are tabs inside each section
    const GROUPS = {
      forecast: [['forecast','CPI'],['pce','PCE'],['expectations','vs. expectations'],['history','Since 1948']],
      drivers:  [['drivers','CPI'],['pce-categories','PCE']],
      rates:    [['rates','Treasury yields'],['fed','The Fed']],
      findings: [['findings','The story'],['track-record','Track record']],
    };
    Object.values(GROUPS).forEach(g=>g.forEach(([id])=>{
      const sec=document.getElementById('page-'+id); if(!sec) return;
      const t=document.createElement('nav'); t.className='subtabs'; t.setAttribute('aria-label','Section');
      t.innerHTML=g.map(([k,l])=>`<a href="#${k}"${k===id?' aria-current="page"':''}>${l}</a>`).join('');
      sec.prepend(t);
    }));
    const groupOf = id => Object.keys(GROUPS).find(k=>GROUPS[k].some(([p])=>p===id)) || id;
    document.addEventListener('toggle', e=>{ if(e.target.classList && e.target.classList.contains('fold')) requestAnimationFrame(redrawVisible); }, true);
    window.addEventListener('hashchange', show);

    // =============== showcase interactions ===============
    const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const surprise = document.getElementById('surpriseBtn');
    if(surprise) surprise.addEventListener('click', ()=>{
      const cur = (location.hash||'').slice(1), opts = PAGES.filter(p=>p!=='overview' && p!==cur);
      location.hash = opts[Math.floor(Math.random()*opts.length)];
    });
    document.querySelectorAll('.xcard').forEach(c=>c.addEventListener('pointermove', e=>{
      const r = c.getBoundingClientRect(); c.style.setProperty('--mx', (e.clientX-r.left)+'px'); c.style.setProperty('--my', (e.clientY-r.top)+'px');
    }));
    const io = ('IntersectionObserver' in window && !reduceMotion) ? new IntersectionObserver(es=>es.forEach(e=>{
      if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
    }), {threshold:.08, rootMargin:'0px 0px -40px 0px'}) : null;
    document.querySelectorAll('.reveal').forEach(el=> io ? io.observe(el) : el.classList.add('in'));
    let counted = false;
    function countUp(){
      if(counted || reduceMotion) return; counted = true;
      document.querySelectorAll('[data-count]').forEach(el=>{
        const end = +el.dataset.count, d = +el.dataset.dec || 0, suf = el.dataset.suf || '', pre = el.dataset.pre || '', from = +el.dataset.from || 0, final = el.textContent, t0 = performance.now(), dur = 1500;
        const step = t => { const k = Math.min(1, (t-t0)/dur), e = 1 - Math.pow(1-k, 4);
          el.textContent = k<1 ? pre + (from + (end-from)*e).toFixed(d) + suf : final; if(k<1) requestAnimationFrame(step); };
        requestAnimationFrame(step);
      });
    }
    const maybeCount = () => { if(document.getElementById('page-overview').classList.contains('active')) countUp(); };
    window.addEventListener('hashchange', maybeCount);
    document.querySelectorAll('.ch-nav button').forEach(b=>b.addEventListener('click', ()=>{ const t=document.getElementById(b.dataset.go); if(t) t.scrollIntoView({behavior: reduceMotion?'auto':'smooth', block:'start'}); }));

    show();
    maybeCount();
  }

  main();
})();
</script>
</body>
</html>
