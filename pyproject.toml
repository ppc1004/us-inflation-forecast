[project]
name = "us-inflation-forecast"
version = "2.0.0"
description = "U.S. Economic Forecast: CPI and PCE inflation by category, Treasury yields and 12-month ARIMA forecasts with public backtests."
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["app.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PD002", "RUF100"]

[tool.ruff.lint.isort]
known-first-party = [
    "data_utils", "archive_forecast", "download_extra", "download_bls", "download_pce",
    "horizon_backtest", "model_benchmark", "pce_forecast", "rates_forecast",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
