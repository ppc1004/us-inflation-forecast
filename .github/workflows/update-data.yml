name: Update Economic Data

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download latest CPI data
        run: python src/download_cpi.py

      # Components, average prices, wages, rates and expectations for the
      # website's context pages. A failure here must not block the forecast.
      - name: Download supporting FRED series
        continue-on-error: true
        run: python src/download_extra.py

      # Detailed CPI categories (about 160) and average prices straight from BLS.
      - name: Download CPI components and average prices (BLS)
        continue-on-error: true
        env:
          BLS_USER_AGENT: ${{ secrets.BLS_USER_AGENT }}
        run: python src/download_bls.py

      # PCE price index, its categories and spending weights from BEA.
      - name: Download PCE data (BEA)
        continue-on-error: true
        run: python src/download_pce.py

      - name: Check whether CPI data changed
        id: cpi_diff
        run: |
          if git diff --quiet -- data/cpi_data.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The forecast, archive, backtest and benchmark outputs are all
      # derived from cpi_data.csv. They only need to be regenerated when a
      # new CPI release actually lands, so this only runs on real changes —
      # or when the workflow is started manually (Run workflow button),
      # e.g. after changing the model code.
      - name: Regenerate forecast and backtest outputs
        if: steps.cpi_diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python src/arima_forecast.py
          python src/archive_forecast.py
          python src/rolling_backtest.py
          python src/horizon_backtest.py
          python src/model_benchmark.py
          python src/make_share_image.py

      - name: Check whether PCE data changed
        id: pce_diff
        run: |
          if git diff --quiet -- data/pce_data.csv && [ -f data/pce_forecast.csv ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Forecast PCE inflation
        if: steps.pce_diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python src/pce_forecast.py

      # Rates are monthly averages, but the current month's average moves every
      # day, so the rate forecasts are refreshed on every run.
      - name: Forecast interest rates
        continue-on-error: true
        run: python src/rates_forecast.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Auto-update economic data and refresh forecasts"
          git push
